/* ===== map/map.css ===== */
/* FlowDeck — map module styles (FD.map)
   Scope: everything lives under .fd-map (the container passed to mount()). */

:root {
  --fd-map-bg: #0b0e13;
  --fd-map-panel: rgba(13, 17, 23, 0.88);
  --fd-map-border: #2a3140;
  --fd-map-text: #c9d1d9;
  --fd-map-muted: #7d8590;
  --fd-map-accent: #f5a623;
  --fd-map-font: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;

  /* vessel colours (also read by map.js at runtime via getComputedStyle) */
  --fd-v-tanker-laden: #f5a623;
  --fd-v-tanker-ballast: #f5a623;
  --fd-v-cargo: #6b7a8f;
  --fd-v-gas: #2dd4bf;
  --fd-v-other: #555555;
  --fd-v-select: #ffffff;
  --fd-choke: #f5a623;
}

.fd-map {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 240px;
  background: var(--fd-map-bg);
  font-family: var(--fd-map-font);
  color: var(--fd-map-text);
  overflow: hidden;
  isolation: isolate;
}
.fd-map .leaflet-container {
  background: var(--fd-map-bg);
  font-family: var(--fd-map-font);
  width: 100%;
  height: 100%;
  outline: none;
}

/* ---- Leaflet chrome overrides (dark) ---- */
.fd-map .leaflet-control-zoom a {
  background: var(--fd-map-panel);
  color: var(--fd-map-text);
  border-color: var(--fd-map-border);
  width: 28px; height: 28px; line-height: 26px;
  font-size: 15px;
}
.fd-map .leaflet-control-zoom a:hover { color: var(--fd-map-accent); background: #151b24; }
.fd-map .leaflet-bar { border: 1px solid var(--fd-map-border); box-shadow: none; }
.fd-map .leaflet-control-attribution {
  background: rgba(11, 14, 19, 0.75);
  color: var(--fd-map-muted);
  font: 10px/1.4 var(--fd-map-font);
  padding: 1px 5px;
}
.fd-map .leaflet-control-attribution a { color: #9aa4b2; }

/* ---- tooltip ---- */
.fd-map .fd-tip {
  background: var(--fd-map-panel);
  color: var(--fd-map-text);
  border: 1px solid var(--fd-map-border);
  border-radius: 2px;
  padding: 5px 8px;
  font: 11px/1.45 var(--fd-map-font);
  box-shadow: 0 2px 10px rgba(0,0,0,.5);
  white-space: nowrap;
}
.fd-map .fd-tip::before { display: none; }
.fd-map .fd-tip .n { color: var(--fd-map-accent); font-weight: 700; letter-spacing: .02em; }
.fd-map .fd-tip .m { color: var(--fd-map-muted); }
.fd-map .fd-tip .l { color: var(--fd-v-tanker-laden); }
.fd-map .fd-tip .b { color: var(--fd-map-muted); }

/* ---- choke-point badge ---- */
.fd-map .fd-choke-badge { background: none; border: 0; }
.fd-map .fd-choke-badge > span {
  display: inline-block;
  transform: translate(-50%, -50%);
  background: rgba(11, 14, 19, 0.85);
  border: 1px solid var(--fd-choke);
  color: var(--fd-choke);
  font: 700 10px/1 var(--fd-map-font);
  letter-spacing: .04em;
  padding: 4px 6px;
  border-radius: 2px;
  white-space: nowrap;
  pointer-events: none;
}
.fd-map .fd-choke-badge > span .cnt { color: #fff; }

/* ---- overlays (presets strip / legend) ---- */
.fd-map .fd-map-ui {
  position: absolute;
  z-index: 800;                 /* above tiles/markers (400-600), below Leaflet popups (700+ / 1000 controls) */
  pointer-events: none;
  font: 11px/1.3 var(--fd-map-font);
}
.fd-map .fd-map-ui > * { pointer-events: auto; }

.fd-map .fd-presets {
  top: 8px; left: 8px; right: 8px;
  display: flex; flex-wrap: wrap; gap: 4px;
  max-width: calc(100% - 16px);
}
.fd-map .fd-presets button {
  appearance: none;
  background: var(--fd-map-panel);
  border: 1px solid var(--fd-map-border);
  color: var(--fd-map-text);
  font: 700 10px/1 var(--fd-map-font);
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 6px 7px;
  min-height: 24px;
  border-radius: 2px;
  cursor: pointer;
  transition: color .12s, border-color .12s;
}
.fd-map .fd-presets button:hover { color: var(--fd-map-accent); border-color: var(--fd-map-accent); }
.fd-map .fd-presets button.active {
  color: #0b0e13; background: var(--fd-map-accent); border-color: var(--fd-map-accent);
}
.fd-map .fd-presets button:focus-visible { outline: 1px solid var(--fd-map-accent); outline-offset: 1px; }

.fd-map .fd-legend {
  right: 8px; bottom: 22px;
  background: var(--fd-map-panel);
  border: 1px solid var(--fd-map-border);
  border-radius: 2px;
  padding: 6px 8px;
  display: grid; grid-template-columns: auto auto; gap: 3px 8px;
  align-items: center;
  color: var(--fd-map-muted);
  font-size: 10px;
  letter-spacing: .03em;
}
.fd-map .fd-legend .sw {
  width: 9px; height: 9px; border-radius: 50%;
  border: 1.5px solid currentColor; box-sizing: border-box;
}
.fd-map .fd-legend .sw.fill { background: currentColor; }
.fd-map .fd-legend .c-tl { color: var(--fd-v-tanker-laden); }
.fd-map .fd-legend .c-tb { color: var(--fd-v-tanker-ballast); }
.fd-map .fd-legend .c-cg { color: var(--fd-v-cargo); }
.fd-map .fd-legend .c-gs { color: var(--fd-v-gas); }
.fd-map .fd-legend .c-ot { color: #8a8a8a; }
.fd-map .fd-legend .c-ck { color: var(--fd-choke); }
.fd-map .fd-legend .sw.poly { border-radius: 1px; background: rgba(245,166,35,.25); }
.fd-map .fd-legend .lbl { color: var(--fd-map-text); }
.fd-map .fd-legend .count {
  grid-column: 1 / -1; margin-top: 2px; padding-top: 3px;
  border-top: 1px solid var(--fd-map-border);
  color: var(--fd-map-muted);
}
.fd-map .fd-legend .count b { color: var(--fd-map-accent); font-weight: 700; }

/* Leaflet default zoom control sits top-left; move it below the presets strip */
.fd-map .leaflet-top.leaflet-left { top: 40px; }

/* ---- phone ---- */
@media (max-width: 640px) {
  .fd-map .fd-presets { gap: 3px; right: 8px; }
  .fd-map .fd-presets button { padding: 7px 6px; font-size: 9px; min-height: 28px; }
  .fd-map .fd-legend { font-size: 9px; padding: 5px 6px; gap: 2px 6px; bottom: 20px; }
  .fd-map .leaflet-top.leaflet-left { top: 76px; }
  .fd-map .leaflet-control-zoom a { width: 32px; height: 32px; line-height: 30px; }
}

/* ===== markets/markets.css ===== */
/* FlowDeck — markets panel styles (Agent C). Pure CSS, dark terminal, phone-friendly. */
:root {
  --fd-bg: #0b0d10;
  --fd-panel: #11151a;
  --fd-panel-2: #171c23;
  --fd-border: #242b34;
  --fd-text: #d7dde5;
  --fd-muted: #7d8794;
  --fd-accent: #f5a623;
  --fd-accent-dim: rgba(245, 166, 35, 0.18);
  --fd-up: #2ecc71;
  --fd-dn: #ff5c5c;
  --fd-flat: #8c96a3;
  --fd-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --fd-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

.fd-markets {
  background: var(--fd-panel);
  color: var(--fd-text);
  font-family: var(--fd-sans);
  font-size: 12px;
  line-height: 1.35;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
  box-sizing: border-box;
}
.fd-markets *, .fd-markets *::before, .fd-markets *::after { box-sizing: border-box; }

/* section */
.fd-sec { border: 1px solid var(--fd-border); background: var(--fd-panel-2); border-radius: 4px; overflow: hidden; }
.fd-sec-head {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 10px; border-bottom: 1px solid var(--fd-border);
  background: linear-gradient(180deg, rgba(245,166,35,0.08), transparent);
}
.fd-sec-head h3 {
  margin: 0; font: 700 11px/1 var(--fd-mono); letter-spacing: 0.14em; color: var(--fd-accent);
}
.fd-status { margin-left: auto; font: 10px/1 var(--fd-mono); color: var(--fd-muted); white-space: nowrap; }
.fd-status.err { color: var(--fd-dn); }
.fd-btn {
  background: transparent; color: var(--fd-accent); border: 1px solid var(--fd-border); border-radius: 3px;
  font: 700 11px/1 var(--fd-mono); padding: 4px 8px; cursor: pointer; letter-spacing: 0.08em;
}
.fd-btn:hover { background: var(--fd-accent-dim); border-color: var(--fd-accent); }
.fd-btn:focus-visible { outline: 2px solid var(--fd-accent); outline-offset: 1px; }

/* price grid */
.fd-grid { font-family: var(--fd-mono); font-variant-numeric: tabular-nums; }
.fd-row {
  display: grid;
  grid-template-columns: minmax(96px, 1.6fr) minmax(62px, 1fr) minmax(58px, 1fr) minmax(62px, 1fr) 84px;
  align-items: center; gap: 6px;
  padding: 4px 10px; border-bottom: 1px solid rgba(36,43,52,0.6);
}
.fd-row:last-child { border-bottom: 0; }
.fd-row:hover:not(.fd-head) { background: rgba(255,255,255,0.025); }
.fd-row.fd-head { color: var(--fd-muted); font-size: 9.5px; letter-spacing: 0.1em; padding-top: 5px; padding-bottom: 5px; background: rgba(0,0,0,0.25); }
.fd-row.na { opacity: 0.5; }
.fd-group { padding: 5px 10px 2px; color: var(--fd-accent); font-size: 9.5px; letter-spacing: 0.14em; opacity: 0.85; }
.fd-c-sym { display: flex; flex-direction: column; min-width: 0; }
.fd-tick { font-weight: 700; color: var(--fd-text); }
.fd-name { font-family: var(--fd-sans); font-size: 10px; color: var(--fd-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fd-c-num { text-align: right; white-space: nowrap; }
.fd-last { color: var(--fd-text); font-weight: 600; }
.fd-row.up .fd-chg, .fd-row.up .fd-pct { color: var(--fd-up); }
.fd-row.dn .fd-chg, .fd-row.dn .fd-pct { color: var(--fd-dn); }
.fd-row.flat .fd-chg, .fd-row.flat .fd-pct { color: var(--fd-flat); }
.fd-c-spark { display: flex; justify-content: flex-end; }
.fd-spark { width: 80px; height: 22px; display: block; }
.fd-spark polyline { fill: none; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.fd-spark.up polyline, .fd-spark.up circle { stroke: var(--fd-up); fill: var(--fd-up); }
.fd-spark.dn polyline, .fd-spark.dn circle { stroke: var(--fd-dn); fill: var(--fd-dn); }
.fd-spark.flat polyline, .fd-spark.flat circle { stroke: var(--fd-flat); fill: var(--fd-flat); }
.fd-spark.up polyline, .fd-spark.dn polyline, .fd-spark.flat polyline { fill: none; }
.fd-spark-empty line { stroke: var(--fd-border); stroke-dasharray: 2 3; }

/* watchlist */
.fd-watch-form { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--fd-border); }
.fd-input {
  flex: 1; min-width: 0; background: var(--fd-bg); color: var(--fd-text); border: 1px solid var(--fd-border); border-radius: 3px;
  font: 12px var(--fd-mono); padding: 5px 8px; text-transform: uppercase;
}
.fd-input:focus { outline: none; border-color: var(--fd-accent); box-shadow: 0 0 0 2px var(--fd-accent-dim); }
.fd-input::placeholder { color: var(--fd-muted); text-transform: none; }
.fd-grid[data-grid="watch"] .fd-row { grid-template-columns: minmax(96px, 1.6fr) minmax(62px, 1fr) minmax(58px, 1fr) minmax(62px, 1fr) 84px 22px; }
.fd-rm {
  background: transparent; border: 0; color: var(--fd-muted); font: 14px/1 var(--fd-mono); cursor: pointer; padding: 0; width: 22px; height: 22px; border-radius: 3px;
}
.fd-rm:hover { color: var(--fd-dn); background: rgba(255,92,92,0.12); }
.fd-rm-ph { width: 22px; }

/* news */
.fd-news { max-height: 320px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--fd-border) transparent; }
.fd-news-item {
  display: block; padding: 6px 10px; text-decoration: none; color: var(--fd-text); border-bottom: 1px solid rgba(36,43,52,0.6);
  border-left: 2px solid transparent;
}
.fd-news-item:hover { background: rgba(255,255,255,0.025); border-left-color: var(--fd-accent); }
.fd-news-title { display: block; font-size: 12px; line-height: 1.3; }
.fd-news-meta { display: flex; gap: 8px; margin-top: 2px; font: 10px var(--fd-mono); color: var(--fd-muted); }
.fd-news-src { color: var(--fd-accent); letter-spacing: 0.06em; }
.fd-empty { padding: 14px 10px; color: var(--fd-muted); font: 11px var(--fd-mono); text-align: center; }

/* narrow widths */
@media (max-width: 420px) {
  .fd-row { grid-template-columns: minmax(70px, 1.4fr) minmax(56px, 1fr) minmax(56px, 1fr) 60px; }
  .fd-grid[data-grid="watch"] .fd-row { grid-template-columns: minmax(70px, 1.4fr) minmax(56px, 1fr) minmax(56px, 1fr) 60px 22px; }
  .fd-chg, .fd-row.fd-head .fd-c-num:nth-child(3) { display: none; }
  .fd-spark { width: 60px; }
  .fd-name { display: none; }
}

/* ===== splc/splc.css ===== */
/* FlowDeck — SPLC module styles (FD.splc)
   Scope: everything lives under .fd-splc (the container passed to mount()). */

:root {
  --fd-splc-bg: #0b0e13;
  --fd-splc-panel: #10151d;
  --fd-splc-panel2: #161c26;
  --fd-splc-border: #2a3140;
  --fd-splc-text: #c9d1d9;
  --fd-splc-muted: #7d8590;
  --fd-splc-accent: #f5a623;
  --fd-splc-accent-dim: rgba(245, 166, 35, 0.18);
  --fd-splc-supplier: #2dd4bf;
  --fd-splc-customer: #f5a623;
  --fd-splc-danger: #f0583a;
  --fd-splc-font: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
}

.fd-splc {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  height: 100%;
  min-height: 320px;
  padding: 10px;
  box-sizing: border-box;
  background: var(--fd-splc-bg);
  color: var(--fd-splc-text);
  font-family: var(--fd-splc-font);
  font-size: 12px;
  line-height: 1.4;
  overflow: auto;
}
.fd-splc *, .fd-splc *::before, .fd-splc *::after { box-sizing: border-box; }
.fd-splc a { color: var(--fd-splc-accent); text-decoration: none; }
.fd-splc a:hover { text-decoration: underline; }
.fd-splc button {
  font: inherit;
  color: var(--fd-splc-text);
  background: var(--fd-splc-panel2);
  border: 1px solid var(--fd-splc-border);
  border-radius: 3px;
  padding: 5px 10px;
  cursor: pointer;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.fd-splc button:hover:not(:disabled) { border-color: var(--fd-splc-accent); color: var(--fd-splc-accent); }
.fd-splc button:disabled { opacity: 0.4; cursor: default; }
.fd-splc button.fd-splc-primary { background: var(--fd-splc-accent); color: #0b0e13; border-color: var(--fd-splc-accent); font-weight: 700; }
.fd-splc button.fd-splc-primary:hover:not(:disabled) { background: #ffb63a; color: #0b0e13; }

/* ---- search bar ---- */
.fd-splc-bar { display: flex; gap: 6px; align-items: center; position: relative; flex-wrap: wrap; }
.fd-splc-tag {
  color: var(--fd-splc-accent);
  font-weight: 700;
  letter-spacing: 0.12em;
  padding: 0 4px;
}
.fd-splc-search { position: relative; flex: 1 1 180px; min-width: 0; }
.fd-splc-search input {
  width: 100%;
  font: inherit;
  color: var(--fd-splc-text);
  background: var(--fd-splc-panel);
  border: 1px solid var(--fd-splc-border);
  border-radius: 3px;
  padding: 6px 8px;
  text-transform: uppercase;
  outline: none;
}
.fd-splc-search input:focus { border-color: var(--fd-splc-accent); }
.fd-splc-search input::placeholder { color: var(--fd-splc-muted); text-transform: none; }
.fd-splc-ac {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 20;
  max-height: 220px; overflow-y: auto;
  background: var(--fd-splc-panel); border: 1px solid var(--fd-splc-border); border-top: none;
  display: none;
}
.fd-splc-ac.open { display: block; }
.fd-splc-ac-item { display: flex; gap: 8px; padding: 5px 8px; cursor: pointer; }
.fd-splc-ac-item .t { color: var(--fd-splc-accent); width: 56px; flex: none; }
.fd-splc-ac-item .n { color: var(--fd-splc-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fd-splc-ac-item .s { color: var(--fd-splc-muted); margin-left: auto; flex: none; font-size: 10px; }
.fd-splc-ac-item:hover, .fd-splc-ac-item.active { background: var(--fd-splc-accent-dim); }
.fd-splc-status { color: var(--fd-splc-muted); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; flex: 1 1 100%; }
.fd-splc-status.err { color: var(--fd-splc-danger); }

/* ---- root card ---- */
.fd-splc-root {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  background: var(--fd-splc-panel); border: 1px solid var(--fd-splc-border); border-left: 3px solid var(--fd-splc-accent);
  padding: 8px 10px;
}
.fd-splc-root .tk { font-size: 20px; font-weight: 700; color: var(--fd-splc-accent); letter-spacing: 0.04em; }
.fd-splc-root .nm { font-size: 13px; }
.fd-splc-root .meta { color: var(--fd-splc-muted); font-size: 10px; display: flex; gap: 12px; flex-wrap: wrap; }
.fd-splc-root .meta b { color: var(--fd-splc-text); font-weight: 600; }
.fd-splc-root .actions { margin-left: auto; display: flex; gap: 6px; }
.fd-splc-peers { color: var(--fd-splc-muted); font-size: 10px; flex: 1 1 100%; }
.fd-splc-peers a { margin-right: 8px; cursor: pointer; }

/* ---- columns ---- */
.fd-splc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fd-splc-col { background: var(--fd-splc-panel); border: 1px solid var(--fd-splc-border); min-width: 0; }
.fd-splc-col h3 {
  margin: 0; padding: 6px 10px; font-size: 11px; letter-spacing: 0.14em; font-weight: 700;
  border-bottom: 1px solid var(--fd-splc-border); display: flex; justify-content: space-between;
}
.fd-splc-col h3 .cnt { color: var(--fd-splc-muted); font-weight: 400; }
.fd-splc-col.sup h3 { color: var(--fd-splc-supplier); }
.fd-splc-col.cus h3 { color: var(--fd-splc-customer); }
.fd-splc-empty { padding: 14px 10px; color: var(--fd-splc-muted); font-size: 11px; }
.fd-splc-row {
  display: grid; grid-template-columns: 54px 1fr 64px; gap: 8px; align-items: center;
  padding: 6px 10px; border-bottom: 1px solid rgba(42, 49, 64, 0.5); cursor: pointer;
}
.fd-splc-row:hover { background: var(--fd-splc-accent-dim); }
.fd-splc-row .tk { color: var(--fd-splc-accent); font-weight: 700; }
.fd-splc-row .tk.nolink { color: var(--fd-splc-muted); font-weight: 400; }
.fd-splc-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fd-splc-row .basis { color: var(--fd-splc-muted); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fd-splc-row .pct { text-align: right; font-variant-numeric: tabular-nums; }
.fd-splc-row .pct.na { color: var(--fd-splc-muted); }
.fd-splc-bar-wrap { grid-column: 1 / -1; height: 3px; background: var(--fd-splc-panel2); }
.fd-splc-bar-fill { height: 100%; background: var(--fd-splc-accent); }
.sup .fd-splc-bar-fill { background: var(--fd-splc-supplier); }
.fd-splc-ev { grid-column: 1 / -1; font-size: 10px; color: var(--fd-splc-muted); display: none; padding-top: 2px; }
.fd-splc-row.open .fd-splc-ev { display: block; }
.fd-splc-ev q { font-style: italic; color: var(--fd-splc-text); quotes: "\201C" "\201D"; }

/* ---- mini graph ---- */
.fd-splc-graph { background: var(--fd-splc-panel); border: 1px solid var(--fd-splc-border); }
.fd-splc-graph svg { display: block; width: 100%; height: auto; max-height: 360px; }
.fd-splc-graph .edge { stroke: var(--fd-splc-border); stroke-width: 1; fill: none; }
.fd-splc-graph .edge.sup { stroke: var(--fd-splc-supplier); opacity: 0.55; }
.fd-splc-graph .edge.cus { stroke: var(--fd-splc-customer); opacity: 0.55; }
.fd-splc-graph .node { cursor: pointer; }
.fd-splc-graph .node circle { fill: var(--fd-splc-panel2); stroke: var(--fd-splc-muted); stroke-width: 1; }
.fd-splc-graph .node.sup circle { stroke: var(--fd-splc-supplier); }
.fd-splc-graph .node.cus circle { stroke: var(--fd-splc-customer); }
.fd-splc-graph .node.root circle { fill: var(--fd-splc-accent); stroke: var(--fd-splc-accent); }
.fd-splc-graph .node:hover circle { stroke-width: 2; }
.fd-splc-graph .node text { font-family: var(--fd-splc-font); font-size: 9px; fill: var(--fd-splc-text); }
.fd-splc-graph .node.root text { fill: #0b0e13; font-weight: 700; font-size: 10px; }
.fd-splc-graph .lbl { font-family: var(--fd-splc-font); font-size: 9px; fill: var(--fd-splc-muted); letter-spacing: 0.1em; }

.fd-splc-foot { color: var(--fd-splc-muted); font-size: 10px; letter-spacing: 0.04em; }

@media (max-width: 640px) {
  .fd-splc { padding: 8px; }
  .fd-splc-cols { grid-template-columns: 1fr; }
  .fd-splc-root .actions { margin-left: 0; }
  .fd-splc-row { grid-template-columns: 48px 1fr 56px; }
}

/* ===== shell/shell.css ===== */
/* FlowDeck shell — layout, command bar, status strip, drawers, modals.
   Loaded LAST so its :root tokens win over module defaults. */
:root {
  --fd-bg: #0b0d10;
  --fd-panel: #11151a;
  --fd-panel-2: #171c23;
  --fd-border: #242b34;
  --fd-text: #d7dde5;
  --fd-muted: #7d8794;
  --fd-accent: #f5a623;
  --fd-accent-dim: rgba(245, 166, 35, 0.18);
  --fd-up: #2ecc71;
  --fd-dn: #ff5c5c;
  --fd-warn: #f7c948;
  --fd-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --fd-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fd-side-w: 360px;
  --fd-top-h: 44px;
  --fd-status-h: 26px;
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; }
body {
  background: var(--fd-bg);
  color: var(--fd-text);
  font-family: var(--fd-sans);
  font-size: 13px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; }
::selection { background: var(--fd-accent-dim); }

#fd-app { display: flex; flex-direction: column; height: 100%; width: 100%; }

/* ---------------------------------------------------------------- top bar */
.fd-top {
  display: flex; align-items: center; gap: 10px;
  height: var(--fd-top-h); padding: 0 12px;
  background: var(--fd-panel); border-bottom: 1px solid var(--fd-border);
  flex: none;
}
.fd-wordmark {
  font-family: var(--fd-mono); font-weight: 700; font-size: 15px; letter-spacing: 0.14em;
  color: var(--fd-accent); white-space: nowrap; user-select: none;
}
.fd-wordmark::before { content: "▮ "; opacity: 0.8; }
.fd-cmd { flex: 1 1 auto; display: flex; align-items: center; position: relative; min-width: 0; }
.fd-cmd-prompt {
  position: absolute; left: 10px; color: var(--fd-accent); font-family: var(--fd-mono); font-size: 13px; pointer-events: none;
}
.fd-cmd input {
  width: 100%; height: 30px; padding: 0 70px 0 26px;
  background: var(--fd-bg); color: var(--fd-text); border: 1px solid var(--fd-border); border-radius: 4px;
  font-family: var(--fd-mono); font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; outline: none;
}
.fd-cmd input::placeholder { text-transform: none; color: var(--fd-muted); letter-spacing: 0; }
.fd-cmd input:focus { border-color: var(--fd-accent); box-shadow: 0 0 0 2px var(--fd-accent-dim); }
.fd-cmd-hint {
  position: absolute; right: 10px; font-family: var(--fd-mono); font-size: 11px; color: var(--fd-muted); pointer-events: none; white-space: nowrap;
}
.fd-cmd-hint.err { color: var(--fd-dn); }
.fd-cmd-hint.ok { color: var(--fd-up); }
.fd-top-btns { display: flex; gap: 6px; flex: none; }
.fd-ibtn {
  height: 28px; padding: 0 10px; border: 1px solid var(--fd-border); border-radius: 4px;
  background: var(--fd-panel-2); color: var(--fd-text); font-family: var(--fd-mono); font-size: 11px; letter-spacing: 0.06em; cursor: pointer;
}
.fd-ibtn:hover { border-color: var(--fd-accent); color: var(--fd-accent); }

/* ---------------------------------------------------------------- status strip */
.fd-status-strip {
  display: flex; align-items: center; gap: 14px; height: var(--fd-status-h); padding: 0 12px;
  background: var(--fd-bg); border-bottom: 1px solid var(--fd-border);
  font-family: var(--fd-mono); font-size: 11px; color: var(--fd-muted); flex: none;
  overflow-x: auto; overflow-y: hidden; white-space: nowrap; scrollbar-width: none;
}
.fd-status-strip::-webkit-scrollbar { display: none; }
.fd-status-strip b { color: var(--fd-text); font-weight: 600; }
.fd-status-strip .acc { color: var(--fd-accent); }
.fd-st-item { display: inline-flex; align-items: center; gap: 5px; flex: none; }
.fd-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fd-muted); display: inline-block; }
.fd-dot[data-state="live"] { background: var(--fd-up); box-shadow: 0 0 6px var(--fd-up); }
.fd-dot[data-state="demo"] { background: var(--fd-accent); }
.fd-dot[data-state="connecting"] { background: var(--fd-warn); animation: fd-blink 1s infinite; }
.fd-dot[data-state="error"] { background: var(--fd-dn); }
.fd-dot[data-state="closed"] { background: var(--fd-muted); }
@keyframes fd-blink { 50% { opacity: 0.25; } }
.fd-st-spacer { flex: 1 1 auto; }

/* ---------------------------------------------------------------- banner */
.fd-banner {
  display: flex; align-items: center; gap: 10px; padding: 6px 12px;
  background: var(--fd-accent-dim); color: var(--fd-text); border-bottom: 1px solid var(--fd-border);
  font-size: 12px; flex: none;
}
.fd-banner b { color: var(--fd-accent); font-family: var(--fd-mono); }
.fd-banner a { color: var(--fd-accent); cursor: pointer; text-decoration: underline; }
.fd-banner .x { margin-left: auto; background: none; border: 0; color: var(--fd-muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; }
.fd-banner .x:hover { color: var(--fd-text); }
.fd-banner[hidden] { display: none; }

/* ---------------------------------------------------------------- main layout */
.fd-main { flex: 1 1 auto; display: flex; min-height: 0; position: relative; }
.fd-mapwrap { flex: 1 1 auto; position: relative; min-width: 0; min-height: 0; display: flex; }
#fd-map { flex: 1 1 auto; min-height: 0; }
.fd-side {
  width: var(--fd-side-w); flex: none; display: flex; flex-direction: column; min-height: 0;
  background: var(--fd-panel); border-left: 1px solid var(--fd-border);
}
.fd-tabs { display: flex; flex: none; border-bottom: 1px solid var(--fd-border); background: var(--fd-bg); }
.fd-tab {
  flex: 1 1 0; height: 32px; border: 0; border-bottom: 2px solid transparent; background: transparent;
  color: var(--fd-muted); font-family: var(--fd-mono); font-size: 11px; letter-spacing: 0.1em; cursor: pointer;
}
.fd-tab:hover { color: var(--fd-text); }
.fd-tab[aria-selected="true"] { color: var(--fd-accent); border-bottom-color: var(--fd-accent); }
.fd-panes { flex: 1 1 auto; min-height: 0; position: relative; }
.fd-pane { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 10px; display: none; scrollbar-width: thin; scrollbar-color: var(--fd-border) transparent; }
.fd-pane.active { display: block; }
#fd-pane-splc { padding: 0; }
#fd-pane-splc .fd-splc { min-height: 100%; height: auto; }
/* the side panel is 360px wide: stack SPLC's two columns like its own phone layout */
#fd-pane-splc .fd-splc-cols { grid-template-columns: 1fr; }
#fd-pane-splc .fd-splc-root .actions { margin-left: 0; }
#fd-pane-splc .fd-splc-row { grid-template-columns: 48px 1fr 56px; }

/* choke table */
.fd-choke-table { width: 100%; border-collapse: collapse; font-family: var(--fd-mono); font-size: 12px; }
.fd-choke-table th { text-align: left; color: var(--fd-muted); font-weight: 500; font-size: 10px; letter-spacing: 0.08em; padding: 4px 6px; border-bottom: 1px solid var(--fd-border); }
.fd-choke-table th.n, .fd-choke-table td.n { text-align: right; }
.fd-choke-table td { padding: 6px; border-bottom: 1px solid var(--fd-border); }
.fd-choke-table tr.row { cursor: pointer; }
.fd-choke-table tr.row:hover td { background: var(--fd-panel-2); color: var(--fd-accent); }
.fd-choke-table td.n b { color: var(--fd-accent); font-weight: 600; }
.fd-choke-table .bar { height: 3px; background: var(--fd-accent); margin-top: 3px; border-radius: 1px; opacity: 0.8; }
.fd-pane-note { color: var(--fd-muted); font-size: 11px; margin: 10px 0 0; line-height: 1.5; }

/* ---------------------------------------------------------------- vessel drawer */
.fd-drawer {
  position: absolute; top: 10px; right: 10px; width: 300px; max-height: calc(100% - 20px); overflow-y: auto;
  background: rgba(17, 21, 26, 0.96); border: 1px solid var(--fd-border); border-left: 3px solid var(--fd-accent); border-radius: 4px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5); z-index: 900; font-family: var(--fd-mono); font-size: 12px;
  transform: translateX(16px); opacity: 0; pointer-events: none; transition: transform .15s ease, opacity .15s ease;
}
.fd-drawer.open { transform: none; opacity: 1; pointer-events: auto; }
.fd-drawer-head { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px 6px; border-bottom: 1px solid var(--fd-border); }
.fd-drawer-head h2 { margin: 0; font-size: 14px; font-weight: 700; color: var(--fd-accent); letter-spacing: 0.04em; flex: 1 1 auto; word-break: break-word; }
.fd-drawer-head .sub { color: var(--fd-muted); font-size: 11px; display: block; margin-top: 2px; font-weight: 400; letter-spacing: 0; }
.fd-drawer .x { background: none; border: 0; color: var(--fd-muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 0 2px; }
.fd-drawer .x:hover { color: var(--fd-text); }
.fd-kv { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; padding: 10px 12px; }
.fd-kv dt { color: var(--fd-muted); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding-top: 2px; }
.fd-kv dd { margin: 0; color: var(--fd-text); word-break: break-word; }
.fd-pill { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; letter-spacing: 0.06em; border: 1px solid var(--fd-border); color: var(--fd-muted); }
.fd-pill.laden { background: var(--fd-accent); color: #111; border-color: var(--fd-accent); font-weight: 700; }
.fd-pill.ballast { border-color: var(--fd-accent); color: var(--fd-accent); }
.fd-pill.choke { border-color: var(--fd-accent); color: var(--fd-accent); background: var(--fd-accent-dim); }

/* SPLC map markers */
.fd-splc-marker {
  width: 12px; height: 12px; background: #fff; border: 2px solid var(--fd-accent); border-radius: 2px;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 0 8px rgba(245,166,35,0.6);
}
.fd-splc-marker.root { width: 16px; height: 16px; background: var(--fd-accent); border-color: #fff; }
.fd-splc-marker.supplier { border-color: #2dd4bf; box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 0 8px rgba(45,212,191,0.6); }
.fd-splc-tip { font-family: var(--fd-mono); font-size: 11px; }
.fd-splc-tip b { color: var(--fd-accent); }
.leaflet-tooltip.fd-splc-tt { background: rgba(13,17,23,0.95); color: var(--fd-text); border: 1px solid var(--fd-border); }
.leaflet-tooltip.fd-splc-tt::before { display: none; }

/* ---------------------------------------------------------------- modals */
.fd-modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: none;
  align-items: center; justify-content: center; padding: 16px;
}
.fd-modal-bg.open { display: flex; }
.fd-modal {
  width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto;
  background: var(--fd-panel); border: 1px solid var(--fd-border); border-top: 3px solid var(--fd-accent); border-radius: 6px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6); padding: 16px 18px 18px;
}
.fd-modal h2 { margin: 0 0 4px; font-family: var(--fd-mono); font-size: 14px; letter-spacing: 0.12em; color: var(--fd-accent); display: flex; align-items: center; }
.fd-modal h2 .x { margin-left: auto; background: none; border: 0; color: var(--fd-muted); font-size: 20px; cursor: pointer; line-height: 1; }
.fd-modal h2 .x:hover { color: var(--fd-text); }
.fd-modal p.lead { margin: 0 0 14px; color: var(--fd-muted); font-size: 12px; }
.fd-field { display: block; margin-bottom: 12px; }
.fd-field > span { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--fd-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fd-muted); margin-bottom: 4px; }
.fd-field > span a { color: var(--fd-accent); text-decoration: none; text-transform: none; letter-spacing: 0; font-family: var(--fd-sans); font-size: 11px; }
.fd-field > span a:hover { text-decoration: underline; }
.fd-field > span em { font-style: normal; color: var(--fd-muted); text-transform: none; letter-spacing: 0; font-family: var(--fd-sans); }
.fd-field input[type="text"], .fd-field input[type="password"], .fd-field input[type="url"] {
  width: 100%; height: 32px; padding: 0 10px; background: var(--fd-bg); color: var(--fd-text);
  border: 1px solid var(--fd-border); border-radius: 4px; font-family: var(--fd-mono); font-size: 12px; outline: none;
}
.fd-field input:focus { border-color: var(--fd-accent); }
.fd-check { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 4px 0 14px; cursor: pointer; }
.fd-check input { accent-color: var(--fd-accent); width: 16px; height: 16px; }
.fd-modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.fd-btn-primary { background: var(--fd-accent); color: #111; border: 0; border-radius: 4px; height: 32px; padding: 0 16px; font-family: var(--fd-mono); font-weight: 700; letter-spacing: 0.08em; cursor: pointer; }
.fd-btn-primary:hover { filter: brightness(1.1); }
.fd-btn-ghost { background: transparent; color: var(--fd-text); border: 1px solid var(--fd-border); border-radius: 4px; height: 32px; padding: 0 14px; font-family: var(--fd-mono); letter-spacing: 0.06em; cursor: pointer; }
.fd-btn-ghost:hover { border-color: var(--fd-accent); }
.fd-help-list { list-style: none; margin: 0; padding: 0; font-family: var(--fd-mono); font-size: 12px; }
.fd-help-list li { display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--fd-border); }
.fd-help-list li:last-child { border-bottom: 0; }
.fd-help-list code { color: var(--fd-accent); font-family: inherit; }
.fd-help-list span { color: var(--fd-text); }
.fd-help-keys { margin-top: 10px; color: var(--fd-muted); font-size: 11px; }
.fd-help-keys kbd { font-family: var(--fd-mono); border: 1px solid var(--fd-border); border-radius: 3px; padding: 0 5px; color: var(--fd-text); }

/* ---------------------------------------------------------------- phone */
@media (max-width: 768px) {
  body { overflow: auto; }
  #fd-app { height: auto; min-height: 100%; }
  .fd-top { padding: 0 10px; gap: 8px; }
  .fd-wordmark { font-size: 13px; letter-spacing: 0.1em; }
  .fd-wordmark::before { content: "▮"; }
  .fd-cmd input { padding-right: 10px; }
  .fd-cmd-hint { display: none; }
  .fd-cmd-hint.err, .fd-cmd-hint.ok { display: block; right: 8px; background: var(--fd-bg); padding-left: 6px; }
  .fd-ibtn { padding: 0 8px; }
  .fd-main { flex-direction: column; }
  .fd-mapwrap { flex: none; height: 55vh; min-height: 55vh; }
  .fd-side { width: 100%; border-left: 0; border-top: 1px solid var(--fd-border); flex: none; }
  .fd-panes { min-height: 60vh; }
  .fd-pane { position: static; inset: auto; display: none; overflow: visible; }
  .fd-pane.active { display: block; }
  .fd-drawer {
    position: fixed; top: auto; right: 0; left: 0; bottom: 0; width: 100%; max-height: 60vh;
    border-left: 0; border-top: 3px solid var(--fd-accent); border-radius: 10px 10px 0 0;
    transform: translateY(20px);
  }
  .fd-drawer.open { transform: none; }
  .fd-modal { padding: 14px; }
}
</style>

    { id: 'bosphorus', name: 'Bosphorus', polygon: [[41.35, 28.95], [41.30, 29.25], [41.05, 29.20], [40.90, 29.10], [40.85, 28.85], [41.05, 28.90], [41.20, 28.95]] },
    { id: 'panama', name: 'Panama Canal', polygon: [[9.55, -80.05], [9.50, -79.65], [9.15, -79.55], [8.85, -79.35], [8.75, -79.60], [8.95, -79.95], [9.25, -80.10]] },
    { id: 'goodhope', name: 'Cape of Good Hope', polygon: [[-33.6, 16.6], [-33.9, 19.2], [-34.6, 21.0], [-35.9, 20.5], [-36.2, 18.5], [-35.5, 16.8], [-34.5, 16.3]] },
    { id: 'danish', name: 'Danish Straits', polygon: [[58.1, 10.3], [57.8, 11.9], [56.4, 12.9], [55.4, 13.0], [54.8, 12.0], [55.3, 10.4], [56.5, 10.2], [57.4, 10.0]] },
    { id: 'gibraltar', name: 'Strait of Gibraltar', polygon: [[36.2, -6.2], [36.3, -5.3], [36.1, -5.0], [35.7, -5.1], [35.75, -5.9], [35.85, -6.2], [36.0, -6.35]] }
  ];

  // ------------------------------------------------------------------- state
  var vessels = new Map();            // mmsi -> vessel
  var listeners = { status: [], vessel: [], tick: [] };
  var lastVesselEmit = new Map();     // mmsi -> ts of last "vessel" event
  var ws = null, wsOpts = null, wantLive = false, backoff = BACKOFF_MIN, reconnectTimer = null;
  var tickTimer = null, demoTimer = null, demoActive = false;
  var demoState = new Map();          // mmsi -> {lane, seg, fwd} (demo only)
  var statusState = { state: 'closed', msg: 'idle' };

  // ----------------------------------------------------------------- helpers
  function emit(evt, payload) {
    var fns = listeners[evt] || [];
    for (var i = 0; i < fns.length; i++) { try { fns[i](payload); } catch (e) { console.error('FD.data listener error', e); } }
  }
  function setStatus(state, msg) { statusState = { state: state, msg: msg || '' }; emit('status', statusState); }

  /** AIS ship type code -> label. */
  function typeLabel(code, name) {
    var n = (name || '').toUpperCase();
    if (/\b(LNG|LPG|GAS)\b/.test(n) || code === 84 || code === 85) return 'LNG/Gas';
    if (code >= 80 && code <= 89) return 'Tanker';
    if (code >= 70 && code <= 79) return 'Cargo';
    return 'Other';
  }

  /** Laden heuristic per PLAN.md. Returns true | false | null. */
  function inferLaden(v) {
    if (v.draught == null || v.draught <= 0) return null;
    if (v.maxDraught && v.maxDraught > 0) return v.draught >= 0.75 * v.maxDraught;
    if (v.typeLabel === 'Tanker' || v.typeLabel === 'LNG/Gas') {
      if (v.draught >= 12.0) return true;
      if (v.draught < 9.0) return false;
      return null;
    }
    if (v.draught >= 10.0) return true;
    if (v.draught < 6.5) return false;
    return null;
  }

  function flagFromMMSI(mmsi) { return MID[Math.floor(mmsi / 1000000)] || null; }

  /** Ray-casting point-in-polygon. polygon = [[lat,lon],...]. */
  function pointInPolygon(lat, lon, polygon) {
    var inside = false;
    for (var i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
      var yi = polygon[i][0], xi = polygon[i][1], yj = polygon[j][0], xj = polygon[j][1];
      var intersect = ((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function chokeFor(lat, lon) {
    for (var i = 0; i < chokePoints.length; i++) {
      if (pointInPolygon(lat, lon, chokePoints[i].polygon)) return chokePoints[i].name;
    }
    return null;
  }

  var chokePoints = CHOKE_DEFS.map(function (c) {
    var lat = 0, lon = 0;
    c.polygon.forEach(function (p) { lat += p[0]; lon += p[1]; });
    return { id: c.id, name: c.name, polygon: c.polygon, center: [lat / c.polygon.length, lon / c.polygon.length], count: 0, tankerCount: 0 };
  });

  /** Recompute per-choke-point counts from the vessel store. */
  function recountChokes() {
    var byName = {};
    chokePoints.forEach(function (c) { c.count = 0; c.tankerCount = 0; byName[c.name] = c; });
    vessels.forEach(function (v) {
      if (!v.chokePoint) return;
      var c = byName[v.chokePoint]; if (!c) return;
      c.count++;
      if (v.typeLabel === 'Tanker' || v.typeLabel === 'LNG/Gas') c.tankerCount++;
    });
  }

  function computeStats() {
    var s = { count: vessels.size, tankers: 0, laden: 0, ballast: 0, chokePoints: [] };
    vessels.forEach(function (v) {
      if (v.typeLabel === 'Tanker' || v.typeLabel === 'LNG/Gas') {
        s.tankers++;
        if (v.laden === true) s.laden++; else if (v.laden === false) s.ballast++;
      }
    });
    s.chokePoints = chokePoints.map(function (c) { return { id: c.id, name: c.name, count: c.count, tankerCount: c.tankerCount }; });
    return s;
  }

  function prune(now) {
    vessels.forEach(function (v, k) { if (now - v.lastSeen > PRUNE_MS) vessels.delete(k); });
  }

  function tick() {
    var now = Date.now();
    prune(now);
    recountChokes();
    emit('tick', computeStats());
  }
  function startTick() { if (!tickTimer) tickTimer = setInterval(tick, TICK_MS); }
  function stopTick() { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } }

  /** Create-or-update a vessel and (throttled) emit "vessel". */
  function upsert(mmsi, patch, now) {
    var v = vessels.get(mmsi);
    if (!v) {
      v = { mmsi: mmsi, name: null, imo: null, lat: null, lon: null, cog: null, sog: null, heading: null,
            shipType: null, typeLabel: 'Other', draught: null, maxDraught: null, laden: null,
            destination: null, eta: null, lastSeen: now, flag: flagFromMMSI(mmsi), chokePoint: null };
      vessels.set(mmsi, v);
    }
    for (var k in patch) if (patch[k] !== undefined) v[k] = patch[k];
    v.lastSeen = now;
    v.typeLabel = typeLabel(v.shipType, v.name);
    v.laden = inferLaden(v);
    if (v.lat != null && v.lon != null) v.chokePoint = chokeFor(v.lat, v.lon);
    var last = lastVesselEmit.get(mmsi) || 0;
    if (now - last >= VESSEL_EVT_MS) { lastVesselEmit.set(mmsi, now); emit('vessel', v); }
    return v;
  }

  // -------------------------------------------------------- aisstream parsing
  function parseAis(raw) {
    var msg; try { msg = JSON.parse(raw); } catch (e) { return; }
    if (!msg || !msg.MetaData) return;
    var meta = msg.MetaData, mmsi = Number(meta.MMSI);
    if (!mmsi) return;
    var now = Date.now();
    var patch = {};
    var metaName = (meta.ShipName || '').trim();
    if (metaName) patch.name = metaName;
    if (msg.MessageType === 'PositionReport' && msg.Message && msg.Message.PositionReport) {
      var p = msg.Message.PositionReport;
      patch.lat = p.Latitude != null ? p.Latitude : meta.latitude;
      patch.lon = p.Longitude != null ? p.Longitude : meta.longitude;
      if (typeof p.Cog === 'number' && p.Cog < 360) patch.cog = p.Cog;
      if (typeof p.Sog === 'number' && p.Sog < 102.3) patch.sog = p.Sog;
      if (typeof p.TrueHeading === 'number' && p.TrueHeading < 360) patch.heading = p.TrueHeading;
    } else if (msg.MessageType === 'ShipStaticData' && msg.Message && msg.Message.ShipStaticData) {
      var s = msg.Message.ShipStaticData;
      if (s.Name) patch.name = String(s.Name).trim();
      if (s.ImoNumber) patch.imo = s.ImoNumber;
      if (typeof s.Type === 'number') patch.shipType = s.Type;
      if (typeof s.MaximumStaticDraught === 'number' && s.MaximumStaticDraught > 0) patch.draught = s.MaximumStaticDraught;
      if (s.Destination) patch.destination = String(s.Destination).trim();
      if (s.Eta && s.Eta.Month) {
        patch.eta = pad(s.Eta.Month) + '-' + pad(s.Eta.Day) + ' ' + pad(s.Eta.Hour) + ':' + pad(s.Eta.Minute);
      }
      if (meta.latitude != null && vessels.get(mmsi) == null) { patch.lat = meta.latitude; patch.lon = meta.longitude; }
    } else {
      return;
    }
    if (wsOpts && wsOpts.types && wsOpts.types.length) {
      var v0 = vessels.get(mmsi), lbl = typeLabel(patch.shipType != null ? patch.shipType : (v0 ? v0.shipType : null), patch.name || (v0 && v0.name));
      var want = wsOpts.types.map(function (t) { return String(t).toLowerCase(); });
      var known = patch.shipType != null || (v0 && v0.shipType != null);
      var ok = !known || // unknown-type vessels pass until static data says otherwise
               (want.indexOf('tanker') >= 0 && lbl === 'Tanker') || (want.indexOf('gas') >= 0 && lbl === 'LNG/Gas') ||
               (want.indexOf('cargo') >= 0 && lbl === 'Cargo') || (want.indexOf('other') >= 0 && lbl === 'Other');
      if (!ok) { vessels.delete(mmsi); return; }
    }
    upsert(mmsi, patch, now);
  }
  function pad(n) { return (n < 10 ? '0' : '') + (n | 0); }

  // -------------------------------------------------------------- websocket
  function openSocket() {
    if (!wantLive) return;
    setStatus('connecting', 'connecting to aisstream.io');
    try { ws = new WebSocket(WS_URL); } catch (e) { setStatus('error', 'WebSocket unavailable: ' + e.message); scheduleReconnect(); return; }
    ws.onopen = function () {
      var sub = { APIKey: wsOpts.apiKey, BoundingBoxes: [wsOpts.bbox || WORLD_BBOX], FilterMessageTypes: ['PositionReport', 'ShipStaticData'] };
      ws.send(JSON.stringify(sub));
      backoff = BACKOFF_MIN;
      setStatus('live', 'subscribed');
    };
    ws.onmessage = function (ev) {
      if (typeof ev.data === 'string') parseAis(ev.data);
      else if (ev.data && ev.data.text) ev.data.text().then(parseAis);
    };
    ws.onerror = function () { setStatus('error', 'websocket error'); };
    ws.onclose = function (ev) {
      ws = null;
      if (wantLive) { setStatus('error', 'closed (' + (ev && ev.code) + '), reconnecting'); scheduleReconnect(); }
      else setStatus('closed', 'disconnected');
    };
  }
  function scheduleReconnect() {
    if (reconnectTimer || !wantLive) return;
    reconnectTimer = setTimeout(function () { reconnectTimer = null; openSocket(); }, backoff);
    backoff = Math.min(BACKOFF_MAX, backoff * 2);
  }

  // -------------------------------------------------------------------- demo
  var NAME_A = ['NORDIC', 'PACIFIC', 'ATLANTIC', 'GULF', 'OCEAN', 'STAR', 'EAGLE', 'FRONT', 'MARAN', 'DELTA', 'MINERVA', 'OLYMPIC', 'SEAWAYS', 'DHT', 'NEW', 'CRUDE', 'ENERGY', 'ASTRO', 'ALMI', 'SONANGOL'];
  var NAME_B = ['FREEDOM', 'PRIDE', 'GLORY', 'SPIRIT', 'VOYAGER', 'TITAN', 'HARMONY', 'HORIZON', 'PIONEER', 'PHOENIX', 'LEADER', 'TRIDENT', 'JEWEL', 'FALCON', 'ARIES', 'ORION', 'ZENITH', 'CENTURY', 'LIBERTY', 'FORTUNE'];
  // Lanes: list of waypoints [lat,lon]; vessels placed along segments. dest = plausible destinations.
  var LANES = [
    { pts: [[28.6, 49.6], [27.2, 51.3], [26.6, 53.5], [26.4, 56.3], [26.5, 56.6], [25.8, 57.0], [24.9, 58.2], [22.5, 61.0], [19.0, 65.0]], n: 80, tanker: 0.8, dest: ['FUJAIRAH', 'RAS TANURA', 'SIKKA', 'NINGBO', 'ULSAN', 'YOSU', 'CHIBA'] },
    { pts: [[19.0, 65.0], [12.0, 70.0], [7.5, 78.0], [6.3, 84.0], [6.0, 94.0], [5.5, 98.5], [3.3, 100.7], [1.9, 102.6], [1.25, 103.7], [1.2, 104.3]], n: 70, tanker: 0.65, dest: ['SINGAPORE', 'PENGERANG', 'TANJUNG PELEPAS', 'MAP TA PHUT', 'NINGBO'] },
    { pts: [[1.2, 104.3], [3.0, 106.0], [8.0, 110.0], [14.0, 112.5], [20.0, 115.5], [22.5, 118.0], [29.0, 123.0], [33.0, 127.0]], n: 40, tanker: 0.55, dest: ['NINGBO', 'QINGDAO', 'ULSAN', 'KAOHSIUNG', 'DALIAN', 'CHIBA'] },
    { pts: [[29.7, -94.9], [28.6, -94.0], [27.3, -92.5], [25.5, -90.0], [24.3, -86.0], [23.5, -82.0]], n: 35, tanker: 0.6, dest: ['CORPUS CHRISTI', 'HOUSTON', 'ROTTERDAM', 'NINGBO', 'ST CROIX'] },
    { pts: [[51.95, 3.8], [52.5, 3.0], [54.5, 2.5], [57.0, 1.5], [59.0, 2.0], [60.5, 3.5]], n: 35, tanker: 0.5, dest: ['ROTTERDAM', 'MONGSTAD', 'SULLOM VOE', 'TEESPORT', 'ANTWERP'] },
    { pts: [[44.7, 37.6], [44.0, 36.0], [42.5, 32.0], [41.6, 29.5], [41.1, 29.05], [40.9, 28.9], [40.5, 27.5]], n: 28, tanker: 0.55, dest: ['NOVOROSSIYSK', 'CEYHAN', 'TUAPSE', 'AUGUSTA', 'TRIESTE'] },
    { pts: [[6.0, 3.5], [4.5, 5.5], [2.0, 6.5], [-2.0, 7.5], [-6.0, 10.0], [-8.0, 12.5]], n: 28, tanker: 0.7, dest: ['BONNY', 'ESCRAVOS', 'LAGOS', 'ROTTERDAM', 'SIKKA', 'NINGBO'] },
    { pts: [[10.4, -64.5], [11.5, -66.5], [12.2, -69.0], [14.5, -70.5], [17.5, -68.0], [18.0, -65.0]], n: 22, tanker: 0.6, dest: ['ST EUSTATIUS', 'HOUSTON', 'CURACAO', 'FREEPORT BS'] },
    { pts: [[12.6, 43.4], [13.6, 42.1], [16.0, 40.5], [20.0, 38.5], [24.0, 36.0], [27.5, 34.0], [29.5, 32.5], [31.2, 32.4]], n: 28, tanker: 0.6, dest: ['SUEZ', 'SIDI KERIR', 'ROTTERDAM', 'YANBU', 'AUGUSTA'] },
    { pts: [[-34.8, 17.0], [-35.2, 19.0], [-35.0, 21.5], [-33.0, 28.0], [-28.0, 33.0]], n: 15, tanker: 0.7, dest: ['DURBAN', 'NINGBO', 'SIKKA', 'ROTTERDAM'] },
    { pts: [[9.4, -79.9], [9.2, -79.75], [9.0, -79.55], [8.6, -79.4]], n: 12, tanker: 0.5, dest: ['BALBOA', 'CRISTOBAL', 'LOS ANGELES', 'HOUSTON'] },
    { pts: [[35.95, -6.1], [35.95, -5.6], [36.0, -5.1], [36.5, -2.0], [37.5, 1.0]], n: 12, tanker: 0.55, dest: ['ALGECIRAS', 'HUELVA', 'CARTAGENA', 'FOS'] },
    { pts: [[57.6, 10.8], [56.9, 11.9], [56.1, 12.6], [55.5, 12.7], [55.0, 12.9], [54.6, 13.5]], n: 12, tanker: 0.5, dest: ['PRIMORSK', 'GOTHENBURG', 'ROTTERDAM', 'GDANSK'] }
  ];
  var FLAG_MIDS = [636, 538, 351, 215, 477, 563, 241, 311, 210, 257, 235, 367, 412, 431, 440, 419, 273, 422, 403, 470, 271, 247, 219, 244, 211, 226];

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function bearing(a, b) {
    var dLon = (b[1] - a[1]) * Math.PI / 180, la1 = a[0] * Math.PI / 180, la2 = b[0] * Math.PI / 180;
    var y = Math.sin(dLon) * Math.cos(la2), x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLon);
    return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
  }

  function buildDemo() {
    vessels.clear(); lastVesselEmit.clear(); demoState.clear();
    var now = Date.now(), seq = 0;
    LANES.forEach(function (lane) {
      var segs = lane.pts.length - 1;
      for (var i = 0; i < lane.n; i++) {
        var si = Math.floor(Math.random() * segs), t = Math.random();
        var a = lane.pts[si], b = lane.pts[si + 1];
        var lat = a[0] + (b[0] - a[0]) * t + rnd(-0.12, 0.12), lon = a[1] + (b[1] - a[1]) * t + rnd(-0.12, 0.12);
        var fwd = Math.random() < 0.5, cog = fwd ? bearing(a, b) : bearing(b, a);
        var isTanker = Math.random() < lane.tanker, isGas = isTanker && Math.random() < 0.15;
        var shipType = isTanker ? (isGas ? 84 : 80 + Math.floor(Math.random() * 4)) : (Math.random() < 0.8 ? 70 + Math.floor(Math.random() * 5) : 30 + Math.floor(Math.random() * 10));
        var name = pick(NAME_A) + ' ' + pick(NAME_B);
        if (isGas) name = name + (Math.random() < 0.5 ? ' LNG' : ' GAS');
        var maxD = isTanker ? rnd(14, 22) : rnd(8, 14), laden = Math.random() < (fwd ? 0.55 : 0.5);
        var draught = laden ? maxD * rnd(0.8, 0.98) : maxD * rnd(0.4, 0.6);
        var mmsi = pick(FLAG_MIDS) * 1000000 + 100000 + (seq++ * 7919) % 900000;
        var sog = Math.random() < 0.08 ? rnd(0, 0.5) : rnd(8, 15);
        var v = upsert(mmsi, {
          name: name, imo: 9000000 + Math.floor(rnd(100000, 999999)), lat: lat, lon: lon, cog: Math.round(cog * 10) / 10,
          sog: Math.round(sog * 10) / 10, heading: Math.round(cog + rnd(-3, 3) + 360) % 360, shipType: shipType,
          draught: Math.round(draught * 10) / 10, maxDraught: Math.round(maxD * 10) / 10, destination: pick(lane.dest),
          eta: pad(1 + Math.floor(Math.random() * 12)) + '-' + pad(1 + Math.floor(Math.random() * 28)) + ' ' + pad(Math.floor(Math.random() * 24)) + ':00'
        }, now);
        demoState.set(v.mmsi, { lane: lane, seg: si, fwd: fwd });
      }
    });
  }

  /** Advance demo vessels along COG; nudge course toward next waypoint; bounce at lane ends. */
  function demoStep() {
    var now = Date.now(), dtH = TICK_MS / 3600000 * 60; // 60x time compression so motion is visible
    vessels.forEach(function (v) {
      var d = demoState.get(v.mmsi); if (!d || v.sog == null) return;
      var distNm = v.sog * dtH, dLat = distNm / 60;
      var rad = v.cog * Math.PI / 180;
      var lat = v.lat + dLat * Math.cos(rad), lon = v.lon + dLat * Math.sin(rad) / Math.max(0.2, Math.cos(v.lat * Math.PI / 180));
      var pts = d.lane.pts, target = d.fwd ? pts[d.seg + 1] : pts[d.seg];
      var dT = Math.abs(lat - target[0]) + Math.abs(lon - target[1]);
      if (dT < 0.25) {
        d.seg += d.fwd ? 1 : -1;
        if (d.seg >= pts.length - 1 || d.seg < 0) { d.fwd = !d.fwd; d.seg = Math.max(0, Math.min(pts.length - 2, d.seg)); v.draught = v.laden ? v.maxDraught * 0.5 : v.maxDraught * 0.9; }
        target = d.fwd ? pts[d.seg + 1] : pts[d.seg];
      }
      var want = bearing([lat, lon], target), diff = ((want - v.cog + 540) % 360) - 180;
      v.cog = Math.round(((v.cog + Math.max(-15, Math.min(15, diff)) + 360) % 360) * 10) / 10;
      v.heading = Math.round(v.cog);
      v.sog = Math.round(Math.max(0, Math.min(16, v.sog + rnd(-0.3, 0.3))) * 10) / 10;
      upsert(v.mmsi, { lat: Math.round(lat * 10000) / 10000, lon: Math.round(lon * 10000) / 10000, cog: v.cog, sog: v.sog, heading: v.heading, draught: Math.round(v.draught * 10) / 10 }, now);
    });
  }

  function stopDemo() { if (demoTimer) { clearInterval(demoTimer); demoTimer = null; } demoActive = false; demoState.clear(); }

  // -------------------------------------------------------------- public API
  var api = {
    /** Open the aisstream.io websocket. opts: { apiKey, bbox?: [[latS,lonW],[latN,lonE]], types?: ["tanker","gas","cargo","other"] } */
    connect: function (opts) {
      if (!opts || !opts.apiKey) { setStatus('error', 'apiKey required'); return; }
      api.disconnect();
      stopDemo(); vessels.clear(); lastVesselEmit.clear();
      wsOpts = { apiKey: opts.apiKey, bbox: opts.bbox || WORLD_BBOX, types: opts.types || null };
      wantLive = true; backoff = BACKOFF_MIN;
      startTick(); openSocket();
    },
    /** Close the socket (no reconnect) and stop demo animation. Vessel store is kept. */
    disconnect: function () {
      wantLive = false;
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      if (ws) { try { ws.close(); } catch (e) {} ws = null; }
      stopDemo(); stopTick();
      setStatus('closed', 'disconnected');
    },
    /** Subscribe: "status" ({state,msg}), "vessel" (vessel), "tick" (stats). Returns unsubscribe fn. */
    on: function (evt, fn) {
      if (!listeners[evt]) listeners[evt] = [];
      listeners[evt].push(fn);
      return function () { var i = listeners[evt].indexOf(fn); if (i >= 0) listeners[evt].splice(i, 1); };
    },
    /** Remove a listener. */
    off: function (evt, fn) { var i = (listeners[evt] || []).indexOf(fn); if (i >= 0) listeners[evt].splice(i, 1); },
    /** Live Map<mmsi, vessel>. Treat as read-only. */
    vessels: function () { return vessels; },
    /** [{id,name,polygon,center,count,tankerCount}] — counts refreshed every tick. */
    chokePoints: chokePoints,
    /** Current stats: {count, tankers, laden, ballast, chokePoints:[{id,name,count,tankerCount}]} */
    stats: function () { recountChokes(); return computeStats(); },
    /** Current status {state,msg}. */
    status: function () { return statusState; },
    /** Seed ~400 synthetic vessels on real lanes and animate them every tick. Emits the same events as live. */
    loadDemo: function () {
      api.disconnect();
      buildDemo();
      demoActive = true;
      startTick();
      demoTimer = setInterval(demoStep, TICK_MS);
      setStatus('live', 'demo data');
      tick();
    },
    /** True while demo animation is running. */
    isDemo: function () { return demoActive; },
    /** Manually advance one tick (prune, recount, emit "tick"); in demo mode also moves vessels. Useful for tests. */
    step: function () { if (demoActive) demoStep(); tick(); },
    /** Exposed helpers for testing / reuse. */
    util: { pointInPolygon: pointInPolygon, chokeFor: chokeFor, typeLabel: typeLabel, inferLaden: inferLaden, flagFromMMSI: flagFromMMSI, parseAis: parseAis }
  };
  window.FD.data = api;
})();

</script>
<script>

  function loadLiveTickers() {

      var arr = Object.keys(j).map(function (k) { return { ticker: j[k].ticker, name: j[k].title, cik: j[k].cik_str }; });

  }

  /* ---------------- graph building ---------------- */
  function relToNode(rel, counterpartTk, role) {
    var e = seedEntity(counterpartTk) || { cik: null, ticker: counterpartTk, name: counterpartTk, hq: null };
    return {
      cik: e.cik, ticker: e.ticker, name: e.name, role: role,

      basis: rel.basis || "",

  function buildSeedGraph(tk) {

    suppliers.sort(byPct); customers.sort(byPct);
    var peers = (SEED.peers[tk] || []).map(function (p) { return seedEntity(p); }).filter(Boolean);

  // Live: EDGAR full-text search for other filers' 10-Ks naming the root as a customer.
  function liveAugment(graph) {
    var p = getProxy();

    var name = graph.root.name.replace(/[,.]?\s*(Inc|Corp|Co|Company|plc|Ltd)\.?$/i, "").trim();
    var q = '"' + name + '" "accounted for" "net sales"';
    var url = viaProxy(SEC_EFTS + "?q=" + encodeURIComponent(q) + "&forms=10-K&dateRange=custom&startdt=" + yearsAgo(2) + "&enddt=" + today());
    setStatus("querying EDGAR full-text search via proxy…");
    return fetchJson(url, 20000).then(function (j) {
      var hits = (j.hits && j.hits.hits) || [];
      var have = {}; graph.suppliers.forEach(function (s) { have[s.cik] = 1; });
      have[graph.root.cik] = 1;
      hits.forEach(function (hit) {
        var s = hit._source || {};
        var cik = parseInt((s.ciks || [])[0], 10);
        if (!cik || have[cik]) return;
        have[cik] = 1;
        var dn = (s.display_names || [""])[0];
        var m = /^(.*?)\s+\(([A-Z.\-]+)(?:,.*?)?\)\s+\(CIK/.exec(dn);
        var acc = (s.adsh || "").replace(/-/g, "");
        var doc = (hit._id || "").split(":")[1] || "";
        graph.suppliers.push({
          cik: cik, ticker: m ? m[2] : "", name: m ? m[1] : dn.split("  (")[0], role: "supplier",
          exposurePct: null, basis: "10-K names " + graph.root.ticker + " near \"accounted for\" (unverified)",
          evidence: [{ source: s.form + " " + s.file_date, snippet: "Full-text search hit; open filing to confirm percentage.", url: "https://www.sec.gov/Archives/edgar/data/" + cik + "/" + acc + "/" + doc }],
          hq: null, inSeed: false, live: true
        });
      });
      graph.source = "seed+edgar";
      setStatus("seed + " + hits.length + " EDGAR full-text hits");
      return graph;
    }).catch(function (e) { setStatus("EDGAR search failed: " + e.message, true); return graph; });
  }
  function liveRoot(ticker) {
    // Non-seed ticker: resolve via ticker index (needs proxy) then data.sec.gov (direct OK).
    var t = (state.liveTickers || []).filter(function (x) { return x.ticker === ticker; })[0];
    if (!t) return Promise.reject(new Error(ticker + " not in seed; add a proxy to resolve via EDGAR"));
    var url = SEC_SUBMISSIONS + padCik(t.cik) + ".json";
    return fetchJson(url, 10000).then(function (sub) {
      var a = (sub.addresses && sub.addresses.business) || {};
      return { root: { cik: t.cik, ticker: ticker, name: sub.name || t.name, hq: null, city: [a.city, a.stateOrCountry].filter(Boolean).join(", ") },
               suppliers: [], customers: [], peers: [], source: "edgar" };
    });
  }
  function today() { return new Date().toISOString().slice(0, 10); }
  function yearsAgo(n) { var d = new Date(); d.setFullYear(d.getFullYear() - n); return d.toISOString().slice(0, 10); }

  function lookup(q) {
    var tk = seedTickerFor(q) || esc(q).trim().toUpperCase();
    if (state.cache[tk]) { state.root = tk; state.graph = state.cache[tk]; render(); return Promise.resolve(state.graph); }
    setStatus("loading " + tk + "…");
    var g = buildSeedGraph(tk);
    var p = g ? liveAugment(g) : loadLiveTickers().then(function () { return liveRoot(tk); }).then(liveAugment);
    return p.then(function (graph) {
      state.root = tk; state.graph = graph; state.cache[tk] = graph;
      if (graph.source === "seed") setStatus(SEED.meta.label + " · " + graph.suppliers.length + " suppliers / " + graph.customers.length + " customers");
      render();
      return graph;
    }).catch(function (e) { setStatus(e.message, true); return null; });
  }

  /* ---------------- rendering ---------------- */
  function setStatus(msg, isErr) {
    state.status = msg;
    var el = state.el && state.el.querySelector(".fd-splc-status");
    if (el) { el.textContent = msg; el.className = "fd-splc-status" + (isErr ? " err" : ""); }
  }
  function plottable(graph) {
    var out = [], seen = {};
    var add = function (n, role) { if (n && n.hq && !seen[n.ticker]) { seen[n.ticker] = 1; out.push({ cik: n.cik, ticker: n.ticker, name: n.name, role: role, hq: n.hq, exposurePct: n.exposurePct == null ? null : n.exposurePct }); } };
    add(graph.root, "root"); graph.suppliers.forEach(function (s) { add(s, "supplier"); }); graph.customers.forEach(function (c) { add(c, "customer"); });
    return out;
  }
  function rowEl(n, colRole) {
    var pct = n.exposurePct;
    var row = h("div", { class: "fd-splc-row" + (n.live ? " live" : ""), onclick: function (ev) {
      if (ev.target.closest && ev.target.closest("a")) return;
      if (ev.target.classList.contains("fd-splc-evtoggle")) { row.classList.toggle("open"); return; }
      if (state.opts.onEntity) try { state.opts.onEntity(n); } catch (e) {}

    } }, [
      h("span", { class: "tk" + (n.inSeed ? "" : " nolink"), text: n.ticker || "—" }),
      h("span", { class: "nm", title: n.name }, [n.name, h("div", { class: "basis", text: n.basis })]),
      h("span", { class: "pct" + (pct == null ? " na" : ""), text: pct == null ? "n/a" : pct.toFixed(pct % 1 ? 1 : 0) + "%" }),
      h("div", { class: "fd-splc-bar-wrap" }, [h("div", { class: "fd-splc-bar-fill", style: "width:" + Math.min(100, pct || 0) + "%" })]),
      h("div", { class: "fd-splc-ev" }, [
        h("q", { text: n.evidence[0].snippet }), " — ",
        h("a", { href: n.evidence[0].url, target: "_blank", rel: "noopener", text: n.evidence[0].source }),
        n.note ? h("div", { text: "note: " + n.note }) : null,
        n.hq ? h("div", { text: "HQ " + n.hq.city }) : null
      ])
    ]);
    row.querySelector(".pct").classList.add("fd-splc-evtoggle");
    row.querySelector(".pct").title = "show evidence";
    return row;
  }
  function colEl(title, role, list) {
    var col = h("div", { class: "fd-splc-col " + (role === "supplier" ? "sup" : "cus") }, [
      h("h3", {}, [title, h("span", { class: "cnt", text: list.length + (role === "supplier" ? " · % = supplier's sales to root" : " · % = root's sales to customer") })])
    ]);
    if (!list.length) col.appendChild(h("div", { class: "fd-splc-empty", text: "none in " + SEED.meta.label + (getProxy() ? "" : " — add a proxy for live EDGAR search") }));

  }

        svg.appendChild(e);
      });
      list.forEach(function (n, i) {
        var y = start + i * rowH;

        g.appendChild(svgEl("circle", { r: 4 }));
        var t = svgEl("text", { x: cls === "sup" ? -8 : 8, y: 3, "text-anchor": cls === "sup" ? "end" : "start" });
        t.textContent = (n.ticker || n.name.slice(0, 10)) + (n.exposurePct != null ? " " + n.exposurePct + "%" : "");
        g.appendChild(t);

    svg.appendChild(root);
    var l1 = svgEl("text", { class: "lbl", x: lx, y: 12, "text-anchor": "start" }); l1.textContent = "SUPPLIERS"; svg.appendChild(l1);
    var l2 = svgEl("text", { class: "lbl", x: rx, y: 12, "text-anchor": "end" }); l2.textContent = "CUSTOMERS"; svg.appendChild(l2);

    var g = state.graph;

      h("div", { class: "meta" }, [
        h("span", {}, ["CIK ", h("b", { text: g.root.cik == null ? "—" : padCik(g.root.cik) })]),
        h("span", {}, ["HQ ", h("b", { text: g.root.hq ? g.root.hq.city : (g.root.city || "—") })]),
        h("span", {}, ["SRC ", h("b", { text: g.source })])
      ]),
      h("div", { class: "actions" }, [
        h("button", { class: "fd-splc-primary", text: "PLOT " + plot.length, disabled: plot.length ? null : "disabled", onclick: function () { if (state.opts.onPlot) try { state.opts.onPlot(plot); } catch (e) {} } }),
        h("a", { href: g.root.cik ? "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=" + padCik(g.root.cik) + "&type=10-K" : "#", target: "_blank", rel: "noopener" }, [h("button", { text: "EDGAR" })])
      ]),

    body.appendChild(h("div", { class: "fd-splc-foot", text: SEED.meta.label + " · generated " + SEED.meta.generated + " · " + SEED.rels.length + " relationships / " + Object.keys(SEED.entities).length + " entities · click a row to re-root, click % for evidence" }));

  }

    var items = [];

      if (!items.length) return close();
      items.forEach(function (it, i) {
        ac.appendChild(h("div", { class: "fd-splc-ac-item" + (i === state.acIndex ? " active" : ""), onmousedown: function (ev) { ev.preventDefault(); inp.value = it.ticker; close(); lookup(it.ticker); } }, [
          h("span", { class: "t", text: it.ticker }), h("span", { class: "n", text: it.name }), h("span", { class: "s", text: it.src })
        ]));
      });
      ac.classList.add("open");
    };
    inp.addEventListener("input", function () { state.acIndex = -1; open(); });
    inp.addEventListener("focus", open);
    inp.addEventListener("blur", function () { setTimeout(close, 120); });
    inp.addEventListener("keydown", function (ev) {
      if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        ev.preventDefault(); if (!items.length) return;

  /* ---------------- mount ---------------- */

      h("span", { class: "fd-splc-tag", text: "SPLC" }),
      h("div", { class: "fd-splc-search" }, [

      ]),

      h("button", { text: getProxy() ? "PROXY ✓" : "PROXY", title: "Set a CORS proxy base for live EDGAR lookups (stored in localStorage fd.splcProxy)", onclick: function () {
        var v = window.prompt("CORS proxy base URL for EDGAR (blank to clear). Proxy must forward ?url=… with User-Agent \"" + UA_NOTE + "\".", getProxy());
        if (v === null) return; setProxy(v); state.liveTickers = null; state.cache = {};
        this.textContent = getProxy() ? "PROXY ✓" : "PROXY"; setStatus(getProxy() ? "proxy set: " + getProxy() : "proxy cleared — seed dataset only");
        loadLiveTickers();
      } }),
      h("div", { class: "fd-splc-status", text: SEED.meta.label + " · " + Object.keys(SEED.entities).length + " entities" })
    ]);
    containerEl.appendChild(bar);
    containerEl.appendChild(h("div", { class: "fd-splc-body" }));
    bindSearch(containerEl);
    render();
    if (getProxy()) loadLiveTickers();
    return FD.splc;
  }

  FD.splc = {
    mount: mount, lookup: lookup,
    graph: function () { return state.graph; },
    setProxy: setProxy, getProxy: getProxy,
    search: searchIndex,
    seed: SEED
  };
})();

</script>
<script>
