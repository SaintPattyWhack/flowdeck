      other:         cssVar('--fd-v-other', '#555555'),
      select:        cssVar('--fd-v-select', '#ffffff'),
      choke:         cssVar('--fd-choke', '#f5a623')
    };
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function category(v) {
    var t = (v.typeLabel || '').toLowerCase();
    if (t.indexOf('gas') >= 0 || t.indexOf('lng') >= 0 || t.indexOf('lpg') >= 0) return 'gas';
    if (t.indexOf('tanker') >= 0) return 'tanker';
    if (t.indexOf('cargo') >= 0) return 'cargo';
    var st = +v.shipType;
    if (st >= 80 && st <= 89) return 'tanker';
    if (st >= 70 && st <= 79) return 'cargo';
    return 'other';
  }
  function styleFor(v) {
    var cat = category(v);
    switch (cat) {
      case 'tanker':
        if (v.laden === true)  return { radius: 3.5, color: colors.tankerLaden, weight: 1, opacity: 1, fillColor: colors.tankerLaden, fillOpacity: 0.95 };
        if (v.laden === false) return { radius: 3.5, color: colors.tankerBallast, weight: 1, opacity: 0.85, fillColor: colors.tankerBallast, fillOpacity: 0.12 };
        return { radius: 3.5, color: colors.tankerLaden, weight: 1, opacity: 0.9, fillColor: colors.tankerLaden, fillOpacity: 0.45 };
      case 'cargo': return { radius: 3, color: colors.cargo, weight: 1, opacity: 0.9, fillColor: colors.cargo, fillOpacity: 0.8 };
      case 'gas':   return { radius: 3.5, color: colors.gas, weight: 1, opacity: 1, fillColor: colors.gas, fillOpacity: 0.9 };
      default:      return { radius: 3, color: colors.other, weight: 1, opacity: 0.9, fillColor: colors.other, fillOpacity: 0.7 };
    }
  }
  function matches(v) {
    if (filter.types && filter.types.length && filter.types.indexOf(category(v)) < 0) return false;
    if (filter.laden === 'laden'   && v.laden !== true)  return false;
    if (filter.laden === 'ballast' && v.laden !== false) return false;
    if (filter.minSog > 0 && !((+v.sog || 0) >= filter.minSog)) return false;
    return true;
  }
  function tooltipHtml(v) {
    var ladenTxt = v.laden === true ? '<span class="l">LADEN</span>' : v.laden === false ? '<span class="b">BALLAST</span>' : '';
    var sog = v.sog == null ? '—' : (+v.sog).toFixed(1) + ' kn';
    return '<div class="n">' + esc(v.name || ('MMSI ' + v.mmsi)) + '</div>' +
      '<div><span class="m">' + esc(v.typeLabel || category(v)) + '</span>' + (ladenTxt ? ' · ' + ladenTxt : '') + ' · ' + sog + '</div>' +
      '<div class="m">→ ' + esc(v.destination || 'n/a') + (v.chokePoint ? ' · ' + esc(v.chokePoint) : '') + '</div>';
  }
  function validPos(v) {
    return v && isFinite(+v.lat) && isFinite(+v.lon) && Math.abs(+v.lat) <= 90 && Math.abs(+v.lon) <= 180;
  }
  // end point of a short line of `px` pixels from latlng in bearing `deg` (0 = north)
  function tickEnd(latlng, deg, px) {
    var p = map.latLngToLayerPoint(latlng);
    var r = (deg || 0) * Math.PI / 180;
    return map.layerPointToLatLng(L.point(p.x + Math.sin(r) * px, p.y - Math.cos(r) * px));
  }

  // ---------------------------------------------------------------- markers
  function createMarker(v) {
    var m = L.circleMarker([+v.lat, +v.lon], L.extend({ renderer: renderer, interactive: true, bubblingMouseEvents: false }, styleFor(v)));
    m._fdv = v;
    m.bindTooltip(function () { return tooltipHtml(m._fdv); }, { className: 'fd-tip', direction: 'top', offset: [0, -6], opacity: 1 });
    m.on('click', function (e) { if (e && e.originalEvent) L.DomEvent.stop(e.originalEvent); select(m._fdv.mmsi, false); });
    return m;
  }
  function applyVisibility(m) {
    var show = matches(m._fdv);
    var on = vesselLayer.hasLayer(m);
    if (show && !on) vesselLayer.addLayer(m);
    else if (!show && on) vesselLayer.removeLayer(m);
    return show;
  }
  function updateMarker(m, v) {
    var old = m._fdv;
    m._fdv = v;
    var lat = +v.lat, lon = +v.lon;
    if (old.lat !== lat || old.lon !== lon) m.setLatLng([lat, lon]);
    if (old.laden !== v.laden || old.typeLabel !== v.typeLabel || old.shipType !== v.shipType) m.setStyle(styleFor(v));
    return applyVisibility(m);
  }
  function upsertVessel(v) {
    if (!map || !validPos(v) || v.mmsi == null) return;
    var key = String(v.mmsi);
    var m = markers.get(key);
    var wasShown, nowShown;
    if (m) {
      wasShown = vesselLayer.hasLayer(m);
      nowShown = updateMarker(m, v);
    } else {
      m = createMarker(v);
      markers.set(key, m);
      wasShown = false;
      nowShown = applyVisibility(m);
    }
    shownCount += (nowShown ? 1 : 0) - (wasShown ? 1 : 0);
    if (selectedMmsi === key) drawSelection();
    scheduleCount();
  }
  function removeVessel(mmsi) {
    var key = String(mmsi), m = markers.get(key);
    if (!m) return;
    if (vesselLayer.hasLayer(m)) { vesselLayer.removeLayer(m); shownCount--; }
    markers.delete(key);
    if (selectedMmsi === key) select(null);
    scheduleCount();
  }
  function setVessels(src) {
    if (!map) return;
    var list = src instanceof Map ? Array.from(src.values()) : Array.isArray(src) ? src : (src && typeof src.values === 'function' ? Array.from(src.values()) : []);
    var seen = new Set();
    shownCount = 0;
    for (var i = 0; i < list.length; i++) {
      var v = list[i];
      if (!validPos(v) || v.mmsi == null) continue;
      var key = String(v.mmsi);
      seen.add(key);
      var m = markers.get(key);
      if (m) { if (updateMarker(m, v)) shownCount++; }
      else { m = createMarker(v); markers.set(key, m); if (applyVisibility(m)) shownCount++; }
    }
    markers.forEach(function (m, key) {
      if (!seen.has(key)) { vesselLayer.removeLayer(m); markers.delete(key); }
    });
    if (selectedMmsi && !markers.has(selectedMmsi)) select(null);
    else if (selectedMmsi) drawSelection();
    refreshZoomTicks();
    updateCount();
  }
  function setFilter(f) {
    f = f || {};
    if ('types' in f) {
      var t = f.types;
      filter.types = (t && t.length) ? t.map(function (x) { return String(x).toLowerCase(); }) : null;
    }
    if ('laden' in f) filter.laden = f.laden || 'all';
    if ('minSog' in f) filter.minSog = +f.minSog || 0;
    if (!map) return;
    shownCount = 0;
    markers.forEach(function (m) { if (applyVisibility(m)) shownCount++; });
    if (selectedMmsi) { var sm = markers.get(selectedMmsi); if (sm && !vesselLayer.hasLayer(sm)) select(null); }
    refreshZoomTicks();
    updateCount();
  }

  // ---------------------------------------------------------------- selection
  function select(mmsi, pan) {
    var key = mmsi == null ? null : String(mmsi);
    var m = key ? markers.get(key) : null;
    selectedMmsi = m ? key : null;
    drawSelection();
    if (m && pan) map.panTo(m.getLatLng());
    if (typeof opts.onSelect === 'function') {
      try { opts.onSelect(m ? m._fdv : null); } catch (e) { console.error('[FD.map] onSelect threw', e); }
    }
  }
  function drawSelection() {
    if (!map) return;
    var m = selectedMmsi ? markers.get(selectedMmsi) : null;
    if (!m) {
      if (ring) { fxLayer.removeLayer(ring); ring = null; }
      if (selTick) { fxLayer.removeLayer(selTick); selTick = null; }
      return;
    }
    var ll = m.getLatLng(), v = m._fdv;
    if (!ring) {
      ring = L.circleMarker(ll, { renderer: renderer, radius: 9, color: colors.select, weight: 1.5, opacity: 0.95, fill: false, interactive: false }).addTo(fxLayer);
    } else ring.setLatLng(ll);
    var cog = v.cog != null ? +v.cog : (v.heading != null ? +v.heading : null);
    if (cog != null && isFinite(cog)) {
      var pts = [ll, tickEnd(ll, cog, 16)];
      if (!selTick) selTick = L.polyline(pts, { renderer: renderer, color: colors.select, weight: 1, opacity: 0.9, interactive: false }).addTo(fxLayer);
      else selTick.setLatLngs(pts);
    } else if (selTick) { fxLayer.removeLayer(selTick); selTick = null; }
  }
  // heading ticks for all visible vessels when zoomed in (single multi-polyline, cheap)
  function refreshZoomTicks() {
    if (!map) return;
    if (map.getZoom() < 8) {
      if (zoomTicks) { fxLayer.removeLayer(zoomTicks); zoomTicks = null; }
      return;
    }
    var b = map.getBounds().pad(0.1), segs = [];
    markers.forEach(function (m) {
      if (!vesselLayer.hasLayer(m)) return;
      var ll = m.getLatLng();
      if (!b.contains(ll)) return;
      var v = m._fdv, cog = v.cog != null ? +v.cog : (v.heading != null ? +v.heading : NaN);
      if (!isFinite(cog) || !((+v.sog || 0) > 0.5)) return;
      segs.push([ll, tickEnd(ll, cog, 9)]);
      if (segs.length > 4000) return;
    });
    if (!zoomTicks) zoomTicks = L.polyline(segs, { renderer: renderer, color: '#c9d1d9', weight: 1, opacity: 0.55, interactive: false }).addTo(fxLayer);
    else zoomTicks.setLatLngs(segs);
  }
  function focusVessel(mmsi) {
    var m = markers.get(String(mmsi));
    if (!m || !map) return false;
    if (!vesselLayer.hasLayer(m)) { // un-hide if filtered out so the user can see it
      vesselLayer.addLayer(m); shownCount++; updateCount();
    }
    setActivePreset(null);
    map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 8), { duration: 0.9 });
    select(m._fdv.mmsi, false);
    return true;
  }

  // ---------------------------------------------------------------- choke points
  function setChokePoints(list) {
    if (!map) return;
    chokeLayer.clearLayers();
    (list || []).forEach(function (cp) {
      if (!cp || !cp.polygon || cp.polygon.length < 3) return;
      var poly = L.polygon(cp.polygon, { renderer: chokeRenderer, pane: 'fd-choke', color: colors.choke, weight: 1, opacity: 0.8, fillColor: colors.choke, fillOpacity: 0.25, interactive: false });
      chokeLayer.addLayer(poly);
      var center = cp.center || poly.getBounds().getCenter();
      var n = cp.tankerCount != null ? cp.tankerCount : (cp.count != null ? cp.count : 0);
      var icon = L.divIcon({ className: 'fd-choke-badge', iconSize: [0, 0], html: '<span>' + esc(cp.name || cp.id) + ' · <span class="cnt">' + n + '</span> tankers</span>' });
      chokeLayer.addLayer(L.marker(center, { icon: icon, interactive: false, keyboard: false, pane: 'fd-choke' }));
    });
  }

  // ---------------------------------------------------------------- basemap
  // CARTO dark_all is the intended look but basemaps.cartocdn.com now watermarks tiles
  // ("API KEY REQUIRED") unless ?key= is supplied (free tier: carto.com/basemaps/apikey).
  // Esri's Dark Gray Canvas needs no key and is used when no CARTO key is given.
  var BASEMAPS = {
    carto: function (key) {
      return L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png' + (key ? '?key=' + encodeURIComponent(key) : ''), {
        subdomains: 'abcd', maxZoom: 12, maxNativeZoom: 12, crossOrigin: true,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
      });
    },
    esri: function () {
      return L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 12, maxNativeZoom: 12,
        attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
      });
    }
  };
  function setBasemap(id, key) {
    if (!map) return false;
    var make = BASEMAPS[id] || BASEMAPS.esri;
    if (baseLayer) { map.removeLayer(baseLayer); baseLayer = null; }
    baseLayer = make(key).addTo(map);
    baseLayer.on('tileerror', function () { // e.g. CARTO blocked -> fall back once
      if (id === 'carto' && !baseFellBack) { baseFellBack = true; setBasemap('esri'); }
    });
    return true;
  }

  // ---------------------------------------------------------------- navigation
  function flyTo(presetId) {
    if (!map) return false;
    var p = null;
    for (var i = 0; i < PRESETS.length; i++) if (PRESETS[i].id === presetId) p = PRESETS[i];
    if (!p) { console.warn('[FD.map] unknown preset', presetId); return false; }
    setActivePreset(p.id);
    if (!p.bounds) map.flyTo(WORLD_CENTER, WORLD_ZOOM, { duration: 0.9 });
    else map.flyToBounds(p.bounds, { padding: [20, 20], maxZoom: 12, duration: 0.9 });
    return true;
  }
  function setActivePreset(id) {
    activePreset = id;
    if (!ui.presets) return;
    var btns = ui.presets.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].dataset.preset === id);
  }

  // ---------------------------------------------------------------- overlays
  function buildUI() {
    var strip = L.DomUtil.create('div', 'fd-map-ui fd-presets', container);
    PRESETS.forEach(function (p) {
      var b = L.DomUtil.create('button', '', strip);
      b.type = 'button'; b.textContent = p.label; b.dataset.preset = p.id; b.title = 'GO ' + p.id.toUpperCase();
      L.DomEvent.on(b, 'click', function (e) { L.DomEvent.stop(e); flyTo(p.id); });
    });
    L.DomEvent.disableClickPropagation(strip);
    L.DomEvent.disableScrollPropagation(strip);
    ui.presets = strip;

    var legend = L.DomUtil.create('div', 'fd-map-ui fd-legend', container);
    legend.innerHTML =
      '<span class="sw fill c-tl"></span><span class="lbl">TANKER LADEN</span>' +
      '<span class="sw c-tb"></span><span class="lbl">TANKER BALLAST</span>' +
      '<span class="sw fill c-cg"></span><span class="lbl">CARGO</span>' +
      '<span class="sw fill c-gs"></span><span class="lbl">LNG / LPG</span>' +
      '<span class="sw fill c-ot"></span><span class="lbl">OTHER</span>' +
      '<span class="sw poly c-ck"></span><span class="lbl">CHOKE POINT</span>' +
      '<span class="count"><b>0</b> shown / 0</span>';
    L.DomEvent.disableClickPropagation(legend);
    ui.legend = legend;
    ui.count = legend.querySelector('.count');
    setActivePreset('world');
  }
  var countTimer = null;
  function scheduleCount() { if (!countTimer) countTimer = setTimeout(function () { countTimer = null; updateCount(); }, 200); }
  function updateCount() {
    if (ui.count) ui.count.innerHTML = '<b>' + shownCount + '</b> shown / ' + markers.size;
  }

  // ---------------------------------------------------------------- mount / destroy
  function mount(el, options) {
    if (!el) throw new Error('[FD.map] mount: container element required');
    if (typeof L === 'undefined') throw new Error('[FD.map] Leaflet (L) not loaded');
    if (map) destroy();
    container = el; opts = options || {};
    L.DomUtil.addClass(container, 'fd-map');
    loadColors();

    map = L.map(container, {
      center: WORLD_CENTER, zoom: WORLD_ZOOM, minZoom: 2, maxZoom: 12,
      worldCopyJump: true, zoomControl: true, attributionControl: true,
      preferCanvas: true, zoomSnap: 0.5, wheelPxPerZoomLevel: 90,
      maxBounds: [[-85, -Infinity], [85, Infinity]], maxBoundsViscosity: 0.5
    });
    setBasemap(opts.basemap || (opts.cartoKey ? 'carto' : 'esri'), opts.cartoKey);

    // choke-point polygons live on a lower pane with their own canvas so they never sit
    // above the vessel canvas and steal pointer events
    map.createPane('fd-choke').style.zIndex = 350;
    chokeRenderer = L.canvas({ pane: 'fd-choke', padding: 0.5 });
    chokeRenderer.addTo(map);
    renderer = L.canvas({ padding: 0.5, tolerance: 4 });
    renderer.addTo(map);
    chokeLayer = L.layerGroup().addTo(map);
    vesselLayer = L.layerGroup().addTo(map);
    fxLayer = L.layerGroup().addTo(map);

    map.on('zoomend', function () { drawSelection(); refreshZoomTicks(); });
    map.on('moveend', refreshZoomTicks);
    map.on('movestart', function () { if (activePreset) setActivePreset(null); });
    map.on('click', function () { if (selectedMmsi) select(null); });

    buildUI();

    // keep Leaflet's size in sync with the container (phones rotating, panels resizing)
    onWinResize = function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () { if (map) map.invalidateSize({ pan: false }); }, 120);
    };
    window.addEventListener('resize', onWinResize);
    window.addEventListener('orientationchange', onWinResize);
    if (typeof ResizeObserver !== 'undefined') { ro = new ResizeObserver(onWinResize); ro.observe(container); }
    setTimeout(function () { if (map) map.invalidateSize(); }, 0);
    return FDmap;
  }
  function destroy() {
    if (!map) return;
    window.removeEventListener('resize', onWinResize);
    window.removeEventListener('orientationchange', onWinResize);
    if (ro) { ro.disconnect(); ro = null; }
    map.remove(); map = null; baseLayer = null; baseFellBack = false;
    markers.clear(); shownCount = 0; selectedMmsi = null; ring = null; selTick = null; zoomTicks = null;
    if (ui.presets && ui.presets.parentNode) ui.presets.parentNode.removeChild(ui.presets);
    if (ui.legend && ui.legend.parentNode) ui.legend.parentNode.removeChild(ui.legend);
    ui = { presets: null, legend: null, count: null };
    if (container) L.DomUtil.removeClass(container, 'fd-map');
    container = null;
  }

  // ---------------------------------------------------------------- export
  var FDmap = {
    mount: mount,
    destroy: destroy,
    setVessels: setVessels,
    upsertVessel: upsertVessel,
    removeVessel: removeVessel,
    setChokePoints: setChokePoints,
    setFilter: setFilter,
    flyTo: flyTo,
    focusVessel: focusVessel,
    select: function (mmsi) { select(mmsi, true); },
    invalidateSize: function () { if (map) map.invalidateSize(); },
    setBasemap: setBasemap,                 // 'carto' (needs key) | 'esri'
    getMap: function () { return map; },
    getFilter: function () { return { types: filter.types ? filter.types.slice() : null, laden: filter.laden, minSog: filter.minSog }; },
    presets: PRESETS.map(function (p) { return { id: p.id, label: p.label }; }),
    stats: function () { return { total: markers.size, shown: shownCount, selected: selectedMmsi }; }
  };
  window.FD.map = FDmap;
})();

</script>
<script>
/* ===== markets/markets.js ===== */
/* FlowDeck — markets module (Agent C)
 * Attaches window.FD.markets = { mount, unmount, refresh, watchlist, setKeys, getKeys, symbols, state }
 * Pure browser JS, no deps. Client-only; all sources are public + CORS-reachable (see README.md).
 */
(function () {
  'use strict';
  window.FD = window.FD || {};

  // ---------------------------------------------------------------- config
  var REFRESH_MS = 60000;             // prices
  var NEWS_MIN_MS = 270000;           // feeds refetched at most every ~4.5 min (rss2json rate-limits)
  var FETCH_TIMEOUT_MS = 8000;        // direct calls
  var PROXY_TIMEOUT_MS = 25000;       // CORS passthroughs are slow (10-20s observed)
  var LS_WATCH = 'fd.watchlist';
  var LS_KEYS = 'fd.keys';
  var LS_CACHE = 'fd.markets.cache';   // last good quotes/news, painted instantly on load
  // CORS passthrough proxies (Yahoo/Stooq send no ACAO header). allorigins echoes the Origin header,
  // so it works from any http(s) origin but NOT from file:// — serve test.html over http.
  var PROXIES = [
    function (u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
    function (u) { return 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u); }
  ];

  // Symbol table: canonical id -> per-source tickers
  var SYMBOLS = [
    { id: 'BRENT', label: 'Brent', kind: 'cmdty', yahoo: 'BZ=F', stooq: 'br.f', eia: 'RBRTE', unit: '$/bbl' },
    { id: 'WTI',   label: 'WTI',   kind: 'cmdty', yahoo: 'CL=F', stooq: 'cl.f', eia: 'RWTC',  unit: '$/bbl' },
    { id: 'NG',    label: 'Henry Hub', kind: 'cmdty', yahoo: 'NG=F', stooq: 'ng.f', unit: '$/MMBtu' },
    { id: 'FRO',  label: 'Frontline',      kind: 'tanker', yahoo: 'FRO',  stooq: 'fro.us' },
    { id: 'STNG', label: 'Scorpio Tankers', kind: 'tanker', yahoo: 'STNG', stooq: 'stng.us' },
    { id: 'TNK',  label: 'Teekay Tankers', kind: 'tanker', yahoo: 'TNK',  stooq: 'tnk.us' },
    { id: 'DHT',  label: 'DHT Holdings',   kind: 'tanker', yahoo: 'DHT',  stooq: 'dht.us' },
    { id: 'INSW', label: 'Intl Seaways',   kind: 'tanker', yahoo: 'INSW', stooq: 'insw.us' },
    { id: 'NAT',  label: 'Nordic American', kind: 'tanker', yahoo: 'NAT', stooq: 'nat.us' },
    { id: 'XOM',  label: 'ExxonMobil', kind: 'major', yahoo: 'XOM',  stooq: 'xom.us' },
    { id: 'CVX',  label: 'Chevron',    kind: 'major', yahoo: 'CVX',  stooq: 'cvx.us' },
    { id: 'SHEL', label: 'Shell',      kind: 'major', yahoo: 'SHEL', stooq: 'shel.us' },
    { id: 'BP',   label: 'BP',         kind: 'major', yahoo: 'BP',   stooq: 'bp.us' }
  ];
  var FEEDS = [
    { name: 'OilPrice', url: 'https://oilprice.com/rss/main' },
    { name: 'gCaptain', url: 'https://gcaptain.com/feed/' },
    { name: 'EIA', url: 'https://www.eia.gov/rss/todayinenergy.xml' }
  ];

  // ---------------------------------------------------------------- state
  var state = {
    quotes: {},          // id -> {price, chg, pct, hist:[], src, t}
    news: [],            // [{title, link, source, date}]
    stamps: { prices: null, news: null, watch: null },
    errors: { prices: null, news: null },
    keys: {}
  };
  var root = null, els = {}, timer = null, inflight = null, pending = false;

  // ---------------------------------------------------------------- utils
  function safeGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function utcStamp(d) { return (d || new Date()).toISOString().slice(11, 19) + ' UTC'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n, hint) {
    if (n == null || isNaN(n)) return '—';
    var d = hint != null ? hint : (Math.abs(n) < 10 ? 3 : 2);
    return Number(n).toFixed(d);
  }
  function signed(n, d, suffix) { if (n == null || isNaN(n)) return '—'; return (n > 0 ? '+' : '') + Number(n).toFixed(d) + (suffix || ''); }
  function relTime(ts) {
    var s = Math.max(0, (Date.now() - ts) / 1000);
    if (s < 60) return 'now'; if (s < 3600) return Math.floor(s / 60) + 'm';
    if (s < 86400) return Math.floor(s / 3600) + 'h'; return Math.floor(s / 86400) + 'd';
  }
  function findSym(id) {
    id = String(id || '').toUpperCase();
    for (var i = 0; i < SYMBOLS.length; i++) if (SYMBOLS[i].id === id || SYMBOLS[i].yahoo === id) return SYMBOLS[i];
    return null;
  }
  function symFor(id) { // unknown tickers become ad-hoc equities on Yahoo
    return findSym(id) || { id: id.toUpperCase(), label: id.toUpperCase(), kind: 'custom', yahoo: id.toUpperCase(), stooq: id.toLowerCase() + '.us' };
  }

  function fetchT(url, opts, ms) {
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var t = setTimeout(function () { if (ctl) ctl.abort(); }, ms || FETCH_TIMEOUT_MS);
    opts = opts || {}; if (ctl) opts.signal = ctl.signal;
    return fetch(url, opts).then(function (r) {
      clearTimeout(t);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r;
    }, function (e) { clearTimeout(t); throw e; });
  }
  // Try each proxy in order until one returns 2xx; resolves with the Response.
  function fetchProxied(url) {
    var i = 0;
    function next(err) {
      if (i >= PROXIES.length) return Promise.reject(err || new Error('proxies failed'));
      return fetchT(PROXIES[i++](url), null, PROXY_TIMEOUT_MS).catch(next);
    }
    return next();
  }

  // ---------------------------------------------------------------- price sources
  // Each source returns Promise<{ [id]: {price, chg, pct, hist, src} }> covering some subset.
  function srcYahooSpark(syms) {
    var tick = syms.map(function (s) { return s.yahoo; }).join(',');
    var url = 'https://query1.finance.yahoo.com/v7/finance/spark?symbols=' + encodeURIComponent(tick) + '&range=1mo&interval=1d';
    return fetchProxied(url).then(function (r) { return r.json(); }).then(function (j) {
      var out = {}, res = (j && j.spark && j.spark.result) || [];
      res.forEach(function (row) {
        var resp = row.response && row.response[0]; if (!resp || !resp.meta) return;
        var s = syms.filter(function (x) { return x.yahoo === row.symbol; })[0]; if (!s) return;
        var m = resp.meta, closes = ((resp.indicators || {}).quote || [{}])[0].close || [];
        var hist = closes.filter(function (v) { return v != null; });
        var price = m.regularMarketPrice != null ? m.regularMarketPrice : hist[hist.length - 1];
        var pct = m.regularMarketChangePercent;
        var chg = (pct != null && price != null) ? price * pct / (100 + pct) : m.fulldayChange;
        if (pct == null && hist.length > 1) { chg = price - hist[hist.length - 2]; pct = chg / hist[hist.length - 2] * 100; }
        out[s.id] = { price: price, chg: chg, pct: pct, hist: hist, src: 'Yahoo', hint: m.priceHint };
      });
      if (!Object.keys(out).length) throw new Error('empty');
      return out;
    });
  }
  function srcYahooChart(syms) { // per-symbol fallback, same proxy
    return Promise.all(syms.map(function (s) {
      var url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(s.yahoo) + '?range=1mo&interval=1d';
      return fetchProxied(url).then(function (r) { return r.json(); }).then(function (j) {
        var res = j && j.chart && j.chart.result && j.chart.result[0]; if (!res) return null;
        var m = res.meta || {}, closes = ((res.indicators || {}).quote || [{}])[0].close || [];
        var hist = closes.filter(function (v) { return v != null; });
        var price = m.regularMarketPrice != null ? m.regularMarketPrice : hist[hist.length - 1];
        var pct = m.regularMarketChangePercent, chg = (pct != null && price != null) ? price * pct / (100 + pct) : m.fulldayChange;
        if (pct == null && hist.length > 1) { chg = price - hist[hist.length - 2]; pct = chg / hist[hist.length - 2] * 100; }
        return [s.id, { price: price, chg: chg, pct: pct, hist: hist, src: 'Yahoo', hint: m.priceHint }];
      }).catch(function () { return null; });
    })).then(function (rows) {
      var out = {}; rows.forEach(function (r) { if (r) out[r[0]] = r[1]; });
      if (!Object.keys(out).length) throw new Error('empty'); return out;
    });
  }
  function srcStooq(syms) { // last resort (unverified from sandbox; stooq blocks many hosts)
    var tick = syms.map(function (s) { return s.stooq; }).join(',');
    var url = 'https://stooq.com/q/l/?s=' + tick + '&f=sd2t2ohlcv&h&e=csv';
    return fetchProxied(url).then(function (r) { return r.text(); }).then(function (csv) {
      var out = {}, lines = csv.trim().split(/\r?\n/).slice(1);
      lines.forEach(function (ln) {
        var c = ln.split(','); if (c.length < 7) return;
        var s = syms.filter(function (x) { return x.stooq.toLowerCase() === c[0].toLowerCase(); })[0];
        var open = parseFloat(c[3]), close = parseFloat(c[6]);
        if (!s || isNaN(close)) return;
        out[s.id] = { price: close, chg: close - open, pct: (close - open) / open * 100, hist: [], src: 'Stooq' };
      });
      if (!Object.keys(out).length) throw new Error('empty'); return out;
    });
  }
  function srcEIA(syms) { // daily spot history for Brent/WTI when a key is present
    var key = state.keys.eia; var eias = syms.filter(function (s) { return s.eia; });
    if (!key || !eias.length) return Promise.resolve({});
    return Promise.all(eias.map(function (s) {
      var url = 'https://api.eia.gov/v2/petroleum/pri/spt/data/?api_key=' + encodeURIComponent(key) +
        '&frequency=daily&data[0]=value&facets[series][]=' + s.eia + '&sort[0][column]=period&sort[0][direction]=desc&length=30';
      return fetchT(url).then(function (r) { return r.json(); }).then(function (j) {
        var rows = (j && j.response && j.response.data) || []; if (!rows.length) return null;
        var hist = rows.map(function (d) { return parseFloat(d.value); }).filter(function (v) { return !isNaN(v); }).reverse();
        var last = hist[hist.length - 1], prev = hist[hist.length - 2];
        return [s.id, { price: last, chg: prev != null ? last - prev : null, pct: prev ? (last - prev) / prev * 100 : null, hist: hist, src: 'EIA spot', date: rows[0].period }];
      }).catch(function () { return null; });
    })).then(function (rows) { var out = {}; rows.forEach(function (r) { if (r) out[r[0]] = r[1]; }); return out; });
  }

  function fetchPrices(syms) {
    var chain = [srcYahooSpark, srcYahooChart, srcStooq];
    var i = 0;
    function next() {
      if (i >= chain.length) return Promise.reject(new Error('all sources failed'));
      var fn = chain[i++];
      return fn(syms).then(function (out) {
        var missing = syms.filter(function (s) { return !out[s.id]; });
        if (missing.length && i < chain.length) {
          return chain[i](missing).then(function (more) { Object.keys(more).forEach(function (k) { out[k] = more[k]; }); return out; }, function () { return out; });
        }
        return out;
      }, function () { return next(); });
    }
    return Promise.all([next(), srcEIA(syms)]).then(function (res) {
      var out = res[0], eia = res[1];
      Object.keys(eia).forEach(function (id) { // EIA overrides commodity spot when available
        var q = out[id]; out[id] = eia[id];
        if (q) out[id].futures = q; // keep futures quote for tooltip
      });
      return out;
    });
  }

  // ---------------------------------------------------------------- news
  function fetchFeed(f) {
    var url = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(f.url);
    return fetchT(url).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || j.status !== 'ok') return [];
      return (j.items || []).map(function (it) {
        var t = Date.parse((it.pubDate || '').replace(' ', 'T') + (/(Z|[+-]\d\d:?\d\d)$/.test(it.pubDate || '') ? '' : 'Z'));
        return { title: it.title || '', link: it.link || '#', source: f.name, date: isNaN(t) ? Date.now() : t };
      });
    }).catch(function () { return []; });
  }
  function fetchNews() { // sequential: rss2json 429s on concurrent calls from one IP
    var lists = [];
    return FEEDS.reduce(function (p, f) {
      return p.then(function () { return fetchFeed(f); }).then(function (l) { lists.push(l); });
    }, Promise.resolve()).then(function () {
      var all = [].concat.apply([], lists);
      if (!all.length) throw new Error('no feeds');
      all.sort(function (a, b) { return b.date - a.date; });
      return all.slice(0, 40);
    });
  }

  // ---------------------------------------------------------------- watchlist
  var watchlist = {
    list: function () { var v = safeGet(LS_WATCH); return Array.isArray(v) ? v : []; },
    add: function (sym) {
      sym = String(sym || '').trim().toUpperCase().replace(/[^A-Z0-9.=\-^]/g, '');
      if (!sym) return false;
      var l = watchlist.list(); if (l.indexOf(sym) >= 0) return false;
      l.push(sym); safeSet(LS_WATCH, l); renderWatch(); refresh(); return true;
    },
    remove: function (sym) {
      var l = watchlist.list().filter(function (s) { return s !== String(sym).toUpperCase(); });
      safeSet(LS_WATCH, l); renderWatch(); return true;
    },
    clear: function () { safeSet(LS_WATCH, []); renderWatch(); }
  };

  // ---------------------------------------------------------------- cache
  function saveCache() { safeSet(LS_CACHE, { quotes: state.quotes, news: state.news, stamps: state.stamps }); }
  function loadCache() {
    var c = safeGet(LS_CACHE); if (!c || !c.quotes) return;
    state.quotes = c.quotes || {}; state.news = c.news || []; state.stamps = c.stamps || state.stamps; state.stale = true;
  }

  // ---------------------------------------------------------------- keys
  function loadKeys() { state.keys = safeGet(LS_KEYS) || {}; return state.keys; }
  function setKeys(k) {
    var cur = loadKeys();
    Object.keys(k || {}).forEach(function (n) { if (k[n]) cur[n] = String(k[n]).trim(); else delete cur[n]; });
    safeSet(LS_KEYS, cur); state.keys = cur;
    if (root) refresh();
    return cur;
  }

  // ---------------------------------------------------------------- render
  function sparkline(hist, up) {
    if (!hist || hist.length < 2) return '<svg class="fd-spark fd-spark-empty" viewBox="0 0 80 22" aria-hidden="true"><line x1="0" y1="11" x2="80" y2="11"/></svg>';
    var w = 80, h = 22, p = 2, min = Math.min.apply(null, hist), max = Math.max.apply(null, hist), rng = (max - min) || 1;
    var pts = hist.map(function (v, i) {
      var x = p + i * (w - 2 * p) / (hist.length - 1), y = h - p - (v - min) / rng * (h - 2 * p);
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    var cls = up === false ? 'dn' : (up ? 'up' : 'flat');
    return '<svg class="fd-spark ' + cls + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<polyline points="' + pts.join(' ') + '"/><circle r="1.8" cx="' + pts[pts.length - 1].split(',')[0] + '" cy="' + pts[pts.length - 1].split(',')[1] + '"/></svg>';
  }
  function priceRow(sym, q, opts) {
    opts = opts || {};
    var d = q ? (q.pct != null ? q.pct : q.chg) : null;
    var up = d != null ? (d > 0 ? true : d < 0 ? false : null) : null;
    var cls = up === true ? 'up' : up === false ? 'dn' : 'flat';
    var dec = q && q.hint != null ? Math.min(q.hint, 4) : undefined;
    var title = sym.label + (sym.unit ? ' · ' + sym.unit : '') + (q && q.src ? ' · ' + q.src : '') + (q && q.date ? ' ' + q.date : '');
    return '<div class="fd-row ' + cls + (q ? '' : ' na') + '" data-sym="' + esc(sym.id) + '" title="' + esc(title) + '">' +
      '<div class="fd-c-sym"><span class="fd-tick">' + esc(sym.id) + '</span><span class="fd-name">' + esc(sym.label) + '</span></div>' +
      '<div class="fd-c-num fd-last">' + (q ? fmt(q.price, dec) : '—') + '</div>' +
      '<div class="fd-c-num fd-chg">' + (q ? signed(q.chg, dec != null ? dec : 2) : '—') + '</div>' +
      '<div class="fd-c-num fd-pct">' + (q ? signed(q.pct, 2, '%') : '—') + '</div>' +
      '<div class="fd-c-spark">' + sparkline(q && q.hist, up) + '</div>' +
      (opts.removable ? '<button class="fd-rm" data-rm="' + esc(sym.id) + '" title="Remove" aria-label="Remove ' + esc(sym.id) + '">×</button>' : '') +
      '</div>';
  }
  function header(extra) {
    return '<div class="fd-row fd-head"><div class="fd-c-sym">SYMBOL</div><div class="fd-c-num">LAST</div><div class="fd-c-num">CHG</div><div class="fd-c-num">CHG%</div><div class="fd-c-spark">30D</div>' + (extra ? '<div class="fd-rm-ph"></div>' : '') + '</div>';
  }
  function stamp(section) {
    var s = state.stamps[section]; return s ? 'updated ' + utcStamp(new Date(s)) : 'waiting…';
  }
  function status(el, msg, kind) { if (!el) return; el.textContent = msg; el.className = 'fd-status' + (kind ? ' ' + kind : ''); }

  function renderPrices() {
    if (!els.prices) return;
    var html = header(false), groups = { cmdty: 'CRUDE & GAS', tanker: 'TANKERS', major: 'MAJORS' }, seen = {};
    SYMBOLS.forEach(function (s) {
      if (!seen[s.kind]) { seen[s.kind] = 1; html += '<div class="fd-group">' + groups[s.kind] + '</div>'; }
      html += priceRow(s, state.quotes[s.id]);
    });
    els.prices.innerHTML = html;
    status(els.pricesStatus, state.errors.prices ? 'source unavailable — ' + state.errors.prices : stamp('prices') + (state.stale && inflight ? ' · refreshing' : ''), state.errors.prices ? 'err' : '');
  }
  function renderNews() {
    if (!els.news) return;

    else if (!state.news.length) { els.news.innerHTML = '<div class="fd-empty">loading feeds…</div>'; }
    else {
      els.news.innerHTML = state.news.map(function (n) {
        return '<a class="fd-news-item" href="' + esc(n.link) + '" target="_blank" rel="noopener noreferrer">' +
          '<span class="fd-news-title">' + esc(n.title) + '</span>' +
          '<span class="fd-news-meta"><span class="fd-news-src">' + esc(n.source) + '</span><span class="fd-news-time">' + relTime(n.date) + '</span></span></a>';
      }).join('');
    }
    status(els.newsStatus, state.errors.news ? 'source unavailable' : stamp('news') + (state.stale ? ' (stale)' : ''), state.errors.news ? 'err' : '');
  }
  function renderWatch() {
    if (!els.watch) return;
    var l = watchlist.list();
    if (!l.length) { els.watch.innerHTML = '<div class="fd-empty">no symbols — add a ticker above (e.g. VLO, TRMD, GLNG)</div>'; }
    else {
      els.watch.innerHTML = header(true) + l.map(function (id) { return priceRow(symFor(id), state.quotes[id.toUpperCase()], { removable: true }); }).join('');
    }
    status(els.watchStatus, l.length ? stamp('prices') : '');
  }
  function renderAll() { renderPrices(); renderNews(); renderWatch(); }

  // ---------------------------------------------------------------- refresh
  function refresh(opts) {
    opts = opts || {};
    if (!root) return Promise.resolve();
    if (inflight) { pending = true; return inflight; }
    var syms = SYMBOLS.slice();
    watchlist.list().forEach(function (id) { if (!findSym(id)) syms.push(symFor(id)); });
    var pP = fetchPrices(syms).then(function (out) {
      Object.keys(out).forEach(function (k) { state.quotes[k] = out[k]; });
      state.stamps.prices = Date.now(); state.errors.prices = null; saveCache();
      var miss = syms.filter(function (s) { return !out[s.id]; });
      if (miss.length === syms.length) state.errors.prices = 'no quotes returned';
    }, function (e) { state.errors.prices = (e && e.message) || 'fetch failed'; })
      .then(function () { renderPrices(); renderWatch(); });
    var newsDue = opts.force || !state.stamps.news || (Date.now() - state.stamps.news) > NEWS_MIN_MS;
    var nP = (newsDue ? fetchNews() : Promise.resolve(state.news)).then(function (items) { state.news = items; if (newsDue) { state.stamps.news = Date.now(); saveCache(); } state.errors.news = null; state.stale = false; },
      function (e) { if (!state.news.length) state.errors.news = (e && e.message) || 'fetch failed'; else state.stale = true; }).then(renderNews);
    inflight = Promise.all([pP, nP]).then(function () { inflight = null; if (pending) { pending = false; refresh(); } });
    return inflight;
  }

  // ---------------------------------------------------------------- mount
  function mount(containerEl) {
    if (!containerEl) throw new Error('FD.markets.mount: container required');
    unmount();
    root = containerEl; loadKeys(); loadCache();
    root.classList.add('fd-markets');
    root.innerHTML =
      '<section class="fd-sec" data-sec="prices"><div class="fd-sec-head"><h3>PRICES</h3><span class="fd-status" data-st="prices">waiting…</span><button class="fd-btn fd-refresh" title="Refresh">↻</button></div><div class="fd-grid" data-grid="prices"></div></section>' +
      '<section class="fd-sec" data-sec="news"><div class="fd-sec-head"><h3>NEWS</h3><span class="fd-status" data-st="news">waiting…</span></div><div class="fd-news" data-grid="news"></div></section>' +
      '<section class="fd-sec" data-sec="watch"><div class="fd-sec-head"><h3>WATCHLIST</h3><span class="fd-status" data-st="watch"></span></div>' +
      '<form class="fd-watch-form" autocomplete="off"><input class="fd-input" name="sym" placeholder="ticker (e.g. VLO)" maxlength="12" spellcheck="false" aria-label="Add symbol"><button class="fd-btn fd-add" type="submit">ADD</button></form>' +
      '<div class="fd-grid" data-grid="watch"></div></section>';
    els = {
      prices: root.querySelector('[data-grid="prices"]'), pricesStatus: root.querySelector('[data-st="prices"]'),
      news: root.querySelector('[data-grid="news"]'), newsStatus: root.querySelector('[data-st="news"]'),
      watch: root.querySelector('[data-grid="watch"]'), watchStatus: root.querySelector('[data-st="watch"]'),
      form: root.querySelector('.fd-watch-form')
    };
    root.addEventListener('click', onClick);
    els.form.addEventListener('submit', onSubmit);
    renderAll();
    refresh();
    timer = setInterval(function () { if (document.hidden) return; refresh(); }, REFRESH_MS);
    return api;
  }
  function onClick(e) {
    var rm = e.target.closest && e.target.closest('[data-rm]');
    if (rm) { e.preventDefault(); watchlist.remove(rm.getAttribute('data-rm')); return; }
    if (e.target.closest && e.target.closest('.fd-refresh')) { e.preventDefault(); refresh({ force: true }); }
  }
  function onSubmit(e) {
    e.preventDefault(); var inp = els.form.querySelector('input'); watchlist.add(inp.value); inp.value = ''; inp.focus();
  }
  function unmount() {
    if (timer) { clearInterval(timer); timer = null; }
    if (root) { root.removeEventListener('click', onClick); root.classList.remove('fd-markets'); root.innerHTML = ''; }
    root = null; els = {};
  }

  var api = {
    mount: mount, unmount: unmount, refresh: refresh, watchlist: watchlist,
    setKeys: setKeys, getKeys: loadKeys, symbols: SYMBOLS, state: state,
    quote: function (id) { return state.quotes[String(id).toUpperCase()] || null; }
  };
  window.FD.markets = api;
})();

</script>
<script>
/* ===== shell/shell.js ===== */
/* FlowDeck shell — app chrome + integration of FD.data / FD.map / FD.markets / FD.splc.
 * Plain browser JS, no bundler. Attaches window.FD.shell = { run(cmd), openSettings(), help(), state }.
 */
(function () {
  'use strict';
  window.FD = window.FD || {};
  var FD = window.FD;

  var LS_KEYS = 'fd.keys';
  var PHONE_MQ = '(max-width: 768px)';

  // ---------------------------------------------------------------- storage
  function lsGet(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function loadKeys() { return lsGet(LS_KEYS) || {}; }
  function saveKeys(patch) {
    var cur = loadKeys();
    Object.keys(patch).forEach(function (n) {
      var v = patch[n];
      if (v === '' || v === null || v === undefined || v === false) delete cur[n]; else cur[n] = v;
    });
    lsSet(LS_KEYS, cur);
    return cur;
  }

  // ---------------------------------------------------------------- dom helpers
  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined) return;
      if (k === 'text') el.textContent = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v);
    });
    (children || []).forEach(function (c) { if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function utcClock(d) { return pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes()) + ':' + pad2(d.getUTCSeconds()) + 'Z'; }
  function isPhone() { return window.matchMedia(PHONE_MQ).matches; }

  // ---------------------------------------------------------------- state
  var state = {
    aisState: 'closed', aisMsg: '', demo: false,
    stats: { count: 0, tankers: 0, laden: 0, ballast: 0, chokePoints: [] },
    lastTick: null, needFullRefresh: true, tab: 'markets', mounted: { markets: false, splc: false },
    selected: null, splcLayer: null
  };
  var els = {};

  // choke-point id -> map preset (where one exists)
  var CHOKE_PRESET = { hormuz: 'hormuz', malacca: 'malacca', suez: 'suez', bosphorus: 'blacksea', danish: 'northsea', gibraltar: null, babelmandeb: null, panama: 'caribbean', goodhope: null };

  // ---------------------------------------------------------------- build chrome
  function build() {
    var app = document.getElementById('fd-app') || document.body.appendChild(h('div', { id: 'fd-app' }));
    app.innerHTML = '';

    // top bar
    els.cmdInput = h('input', { type: 'text', placeholder: 'command — MAP, TANK, GAS, PX, NEWS, WL, SPLC WMT, GO HORMUZ, SET, HELP', autocomplete: 'off', spellcheck: 'false', 'aria-label': 'Command', id: 'fd-cmd' });
    els.cmdHint = h('span', { class: 'fd-cmd-hint', text: 'press / to focus' });
    var top = h('header', { class: 'fd-top' }, [
      h('div', { class: 'fd-wordmark', text: 'FLOWDECK', title: 'FlowDeck — commodity flow terminal' }),

      h('span', { class: 'fd-st-item' }, ['TANKERS ', els.stTank]),
      h('span', { class: 'fd-st-item' }, ['LADEN ', els.stLaden, ' / BALLAST ', els.stBallast]),
      h('span', { class: 'fd-st-item' }, ['UPDATED ', els.stUpdated]),
      h('span', { class: 'fd-st-spacer' }),

    ]);

    // banner
    els.banner = h('div', { class: 'fd-banner', hidden: 'hidden' }, [
      h('b', { text: 'DEMO' }),
      h('span', { html: 'Demo data — add a free <a data-act="set">aisstream.io key in SET</a> for live AIS' }),

    ]);

    // main: map + side panel
    els.map = h('div', { id: 'fd-map' });
    els.drawer = h('aside', { class: 'fd-drawer', 'aria-label': 'Vessel detail' });
    els.mapwrap = h('div', { class: 'fd-mapwrap' }, [els.map, els.drawer]);

    els.tabs = {};
    els.panes = {};
    var tabBar = h('div', { class: 'fd-tabs', role: 'tablist' });
    var panes = h('div', { class: 'fd-panes' });
    [['markets', 'MARKETS'], ['splc', 'SPLC'], ['choke', 'CHOKE']].forEach(function (t) {
      els.tabs[t[0]] = h('button', { class: 'fd-tab', role: 'tab', 'aria-selected': 'false', 'data-tab': t[0], text: t[1], onclick: function () { showTab(t[0]); } });
      tabBar.appendChild(els.tabs[t[0]]);
      els.panes[t[0]] = h('div', { class: 'fd-pane', id: 'fd-pane-' + t[0], role: 'tabpanel' });
      panes.appendChild(els.panes[t[0]]);
    });
    els.side = h('section', { class: 'fd-side' }, [tabBar, panes]);
    var main = h('div', { class: 'fd-main' }, [els.mapwrap, els.side]);

    // modals
    els.settingsBg = h('div', { class: 'fd-modal-bg', id: 'fd-settings' });
    els.helpBg = h('div', { class: 'fd-modal-bg', id: 'fd-help' });
    [els.settingsBg, els.helpBg].forEach(function (bg) { bg.addEventListener('click', function (e) { if (e.target === bg) closeModals(); }); });

    app.appendChild(top); app.appendChild(strip); app.appendChild(els.banner); app.appendChild(main);
    document.body.appendChild(els.settingsBg); document.body.appendChild(els.helpBg);

    // choke pane skeleton
    els.chokeBody = h('tbody');
    els.panes.choke.appendChild(h('table', { class: 'fd-choke-table' }, [
      h('thead', null, [h('tr', null, [h('th', { text: 'CHOKE POINT' }), h('th', { class: 'n', text: 'VESSELS' }), h('th', { class: 'n', text: 'TANKERS' })])]),
      els.chokeBody
    ]));
    els.panes.choke.appendChild(h('p', { class: 'fd-pane-note', text: 'Counts are vessels currently inside each hand-drawn polygon. Click a row to fly there.' }));

    // command input
    els.cmdInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); run(els.cmdInput.value); els.cmdInput.value = ''; }
      else if (e.key === 'Escape') { els.cmdInput.blur(); }
    });
    els.cmdInput.addEventListener('input', function () { setHint('', ''); });
  }

  function setHint(text, cls) {
    els.cmdHint.textContent = text || 'press / to focus';
    els.cmdHint.className = 'fd-cmd-hint' + (cls ? ' ' + cls : '');
    if (cls) { clearTimeout(setHint.t); setHint.t = setTimeout(function () { setHint('', ''); }, 4000); }
  }

  // ---------------------------------------------------------------- tabs
  function showTab(id) {
    state.tab = id;
    Object.keys(els.tabs).forEach(function (k) {
      els.tabs[k].setAttribute('aria-selected', k === id ? 'true' : 'false');
      els.panes[k].classList.toggle('active', k === id);
    });
    if (id === 'markets' && !state.mounted.markets && FD.markets) {
      state.mounted.markets = true;
      try { FD.markets.mount(els.panes.markets); } catch (e) { console.error('[FD.shell] markets mount failed', e); }
    }
    if (id === 'splc' && !state.mounted.splc && FD.splc) {
      state.mounted.splc = true;
      try { FD.splc.mount(els.panes.splc, { onEntity: function () { showTab('splc'); }, onPlot: plotEntities }); } catch (e) { console.error('[FD.shell] splc mount failed', e); }
    }
    if (isPhone()) { try { els.side.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function scrollToSection(sec) {
    showTab('markets');
    var s = els.panes.markets.querySelector('[data-sec="' + sec + '"]');
    if (s) { try { s.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }

  // ---------------------------------------------------------------- status strip
  function renderStatus() {
    var st = state.aisState, label;
    var dotState = st;
    if (st === 'live' && state.demo) { dotState = 'demo'; label = 'DEMO'; }
    else label = { live: 'LIVE', connecting: 'CONNECTING', error: 'ERROR', closed: 'OFFLINE' }[st] || st.toUpperCase();
    els.dot.setAttribute('data-state', dotState);
    els.stAis.textContent = label;
    els.stAis.title = state.aisMsg || '';
    var s = state.stats;
    els.stCount.textContent = s.count || 0;
    els.stTank.textContent = s.tankers || 0;
    els.stLaden.textContent = s.laden || 0;
    els.stBallast.textContent = s.ballast || 0;
    els.stUpdated.textContent = state.lastTick ? utcClock(new Date(state.lastTick)) : '—';
  }
  function renderChokeTable() {
    var rows = (FD.data && FD.data.chokePoints || []).slice().sort(function (a, b) { return (b.count - a.count) || (b.tankerCount - a.tankerCount); });
    var max = rows.reduce(function (m, r) { return Math.max(m, r.count || 0); }, 0) || 1;
    els.chokeBody.innerHTML = rows.map(function (r) {
      return '<tr class="row" data-id="' + esc(r.id) + '"><td>' + esc(r.name) + '<div class="bar" style="width:' + Math.round((r.count || 0) / max * 100) + '%"></div></td>' +
        '<td class="n"><b>' + (r.count || 0) + '</b></td><td class="n">' + (r.tankerCount || 0) + '</td></tr>';
    }).join('');
  }
  function onChokeClick(e) {
    var tr = e.target.closest && e.target.closest('tr.row'); if (!tr) return;
    var id = tr.getAttribute('data-id'), preset = CHOKE_PRESET[id];
    var cp = (FD.data.chokePoints || []).filter(function (c) { return c.id === id; })[0];
    if (preset && FD.map.flyTo(preset)) { /* preset view */ }
    else if (cp && cp.center && FD.map.getMap()) { FD.map.getMap().flyTo(cp.center, 6, { duration: 0.8 }); }
    if (isPhone()) { try { els.mapwrap.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (er) {} }
  }

  // ---------------------------------------------------------------- data wiring
  function wireData() {
    if (!FD.data) return;
    FD.data.on('status', function (s) {
      state.aisState = s.state; state.aisMsg = s.msg || '';
      state.demo = !!(FD.data.isDemo && FD.data.isDemo());
      if (s.state === 'connecting') state.needFullRefresh = true;
      renderStatus();
    });
    FD.data.on('tick', function (t) {
      state.stats = t; state.lastTick = Date.now();
      state.demo = !!(FD.data.isDemo && FD.data.isDemo());
      if (state.needFullRefresh) { state.needFullRefresh = false; FD.map.setVessels(FD.data.vessels()); }
      FD.map.setChokePoints(FD.data.chokePoints);
      renderStatus(); renderChokeTable();
      if (state.selected) { var v = FD.data.vessels().get(state.selected.mmsi); if (v) renderDrawer(v); }
    });
    FD.data.on('vessel', function (v) { if (!state.needFullRefresh) FD.map.upsertVessel(v); });
  }
  function startDemo() {
    state.needFullRefresh = true;
    FD.data.loadDemo();
    els.banner.hidden = false;
  }
  function startLive(key) {
    state.needFullRefresh = true;
    els.banner.hidden = true;
    FD.map.setVessels([]);
    FD.data.disconnect();
    FD.data.connect({ apiKey: key });
  }
  function applyConnection() {
    var k = loadKeys();
    if (k.aisstream && !k.demo) startLive(k.aisstream); else startDemo();
  }

  // ---------------------------------------------------------------- vessel drawer
  function fmt(v, suffix, digits) { return (v === null || v === undefined || v === '' || (typeof v === 'number' && isNaN(v))) ? '—' : (typeof v === 'number' && digits != null ? v.toFixed(digits) : v) + (suffix || ''); }
  function ago(ts) {
    if (!ts) return '—';
    var s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 60) return s + 's ago'; if (s < 3600) return Math.round(s / 60) + 'm ago'; return Math.round(s / 3600) + 'h ago';
  }
  function renderDrawer(v) {
    state.selected = v;
    var ladenPill = v.laden === true ? '<span class="fd-pill laden">LADEN</span>' : v.laden === false ? '<span class="fd-pill ballast">BALLAST</span>' : '<span class="fd-pill">UNKNOWN</span>';
    els.drawer.innerHTML =
      '<div class="fd-drawer-head"><h2>' + esc(v.name || 'MMSI ' + v.mmsi) + '<span class="sub">' + esc(v.typeLabel || 'Vessel') + (v.flag ? ' · ' + esc(v.flag) : '') + (v.shipType != null ? ' · AIS ' + esc(v.shipType) : '') + '</span></h2>' +
      '<button class="x" title="Close (Esc)" aria-label="Close">×</button></div>' +
      '<dl class="fd-kv">' +
      '<dt>State</dt><dd>' + ladenPill + (v.chokePoint ? ' <span class="fd-pill choke">' + esc(v.chokePoint) + '</span>' : '') + '</dd>' +
      '<dt>SOG / COG</dt><dd>' + fmt(v.sog, ' kn', 1) + ' / ' + fmt(v.cog, '°', 0) + (v.heading != null ? ' (hdg ' + fmt(v.heading, '°', 0) + ')' : '') + '</dd>' +
      '<dt>Draught</dt><dd>' + fmt(v.draught, ' m', 1) + (v.maxDraught ? ' / max ' + fmt(v.maxDraught, ' m', 1) : '') + '</dd>' +
      '<dt>Destination</dt><dd>' + esc(fmt(v.destination)) + '</dd>' +
      '<dt>ETA</dt><dd>' + esc(fmt(v.eta)) + '</dd>' +
      '<dt>Position</dt><dd>' + fmt(v.lat, '', 3) + ', ' + fmt(v.lon, '', 3) + '</dd>' +
      '<dt>Last seen</dt><dd>' + ago(v.lastSeen) + '</dd>' +
      '<dt>MMSI / IMO</dt><dd>' + esc(v.mmsi) + ' / ' + esc(fmt(v.imo)) + '</dd>' +
      '</dl>';
    els.drawer.querySelector('.x').addEventListener('click', closeDrawer);
    els.drawer.classList.add('open');
  }
  function closeDrawer() {
    state.selected = null;
    els.drawer.classList.remove('open');
    if (FD.map && FD.map.select) { try { FD.map.select(null); } catch (e) {} }
  }

  // ---------------------------------------------------------------- SPLC plotting
  function plotEntities(entities) {
    var map = FD.map.getMap(); if (!map || !window.L) return;
    if (!state.splcLayer) state.splcLayer = L.layerGroup().addTo(map);
    state.splcLayer.clearLayers();
    var pts = [];
    (entities || []).forEach(function (e) {
      if (!e.hq || typeof e.hq.lat !== 'number') return;
      var role = e.role || 'entity';
      var icon = L.divIcon({ className: 'fd-splc-marker ' + role, iconSize: role === 'root' ? [16, 16] : [12, 12] });
      var m = L.marker([e.hq.lat, e.hq.lon], { icon: icon, zIndexOffset: 1000 });
      m.bindTooltip('<div class="fd-splc-tip"><b>' + esc(e.ticker || e.name) + '</b> ' + esc(e.name) + '<br>' + esc(role.toUpperCase()) +
        (e.exposurePct != null ? ' · ' + e.exposurePct + '%' : '') + ' · ' + esc(e.hq.city || '') + '</div>', { className: 'fd-splc-tt', direction: 'top', offset: [0, -8] });
      m.on('click', function () { if (FD.splc && e.ticker) { showTab('splc'); FD.splc.lookup(e.ticker); } });
      state.splcLayer.addLayer(m); pts.push([e.hq.lat, e.hq.lon]);
    });
    if (pts.length) { try { map.fitBounds(pts, { padding: [40, 40], maxZoom: 6 }); } catch (e) {} }
    if (isPhone()) { try { els.mapwrap.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
    setHint('plotted ' + pts.length + ' HQ', 'ok');
  }
  function clearPlot() { if (state.splcLayer) state.splcLayer.clearLayers(); }

  // ---------------------------------------------------------------- commands
  var COMMANDS = [
    ['MAP', 'Show map, clear vessel filter'],
    ['TANK', 'Map, tankers only'],
    ['GAS', 'Map, LNG/LPG carriers only'],
    ['PX', 'Prices panel'],
    ['NEWS', 'News panel'],
    ['WL', 'Watchlist panel'],
    ['SPLC <TICKER>', 'Supply-chain graph for a ticker (e.g. SPLC WMT)'],
    ['GO <PRESET>', 'Fly map to a preset: ' + (FD.map && FD.map.presets ? FD.map.presets.map(function (p) { return p.id; }).join(', ') : 'world, gulf, hormuz, …')],
    ['CHOKE', 'Choke-point table'],
    ['CLEAR', 'Remove SPLC markers from the map'],
    ['SET', 'Settings (API keys, demo mode)'],
    ['HELP', 'This list']
  ];
  function showMap() {
    if (isPhone()) { try { els.mapwrap.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
    FD.map.invalidateSize();
  }
  function run(raw) {
    var line = String(raw || '').trim(); if (!line) return false;
    var parts = line.split(/\s+/), cmd = parts[0].toUpperCase(), arg = parts.slice(1).join(' ');
    closeModals();
    switch (cmd) {
      case 'MAP': FD.map.setFilter({ types: null, laden: 'all', minSog: 0 }); showMap(); setHint('map · all vessels', 'ok'); return true;
      case 'TANK': case 'TANKER': case 'TANKERS': FD.map.setFilter({ types: ['tanker'], laden: 'all' }); showMap(); setHint('map · tankers', 'ok'); return true;
      case 'GAS': case 'LNG': FD.map.setFilter({ types: ['gas'], laden: 'all' }); showMap(); setHint('map · gas carriers', 'ok'); return true;
      case 'LADEN': FD.map.setFilter({ types: ['tanker'], laden: 'laden' }); showMap(); setHint('map · laden tankers', 'ok'); return true;
      case 'BALLAST': FD.map.setFilter({ types: ['tanker'], laden: 'ballast' }); showMap(); setHint('map · ballast tankers', 'ok'); return true;
      case 'PX': case 'PRICES': scrollToSection('prices'); return true;
      case 'NEWS': scrollToSection('news'); return true;
      case 'WL': case 'WATCH': case 'WATCHLIST': scrollToSection('watch'); return true;
      case 'CHOKE': showTab('choke'); return true;
      case 'CLEAR': clearPlot(); setHint('cleared', 'ok'); return true;
      case 'SPLC':
        showTab('splc');
        if (arg && FD.splc) { FD.splc.lookup(arg); setHint('SPLC ' + arg.toUpperCase(), 'ok'); }
        else { var inp = els.panes.splc.querySelector('input'); if (inp) inp.focus(); }
        return true;
      case 'GO':
        if (!arg) { setHint('GO <preset>: ' + FD.map.presets.map(function (p) { return p.id; }).join(' '), 'err'); return false; }
        var pid = arg.toLowerCase().replace(/[^a-z]/g, '');
        var ok = FD.map.flyTo(pid);
        if (!ok) { var alias = { black: 'blacksea', north: 'northsea', us: 'usgulf', africa: 'westafrica', carib: 'caribbean' }[pid]; if (alias) ok = FD.map.flyTo(alias); }
        if (ok) { showMap(); setHint('→ ' + pid, 'ok'); }
        else setHint('unknown preset "' + pid + '"', 'err');
        return ok;
      case 'SET': case 'SETTINGS': openSettings(); return true;
      case 'HELP': case '?': openHelp(); return true;
      case 'DEMO': saveKeys({ demo: true }); applyConnection(); return true;
      case 'LIVE': saveKeys({ demo: false }); applyConnection(); return true;
      default:
        setHint('unknown "' + cmd + '" — try HELP', 'err');
        return false;
    }
  }

  // ---------------------------------------------------------------- modals
  function closeModals() { els.settingsBg.classList.remove('open'); els.helpBg.classList.remove('open'); }
  function openHelp() {
    els.helpBg.innerHTML = '';
    var list = h('ul', { class: 'fd-help-list' }, COMMANDS.map(function (c) { return h('li', null, [h('code', { text: c[0] }), h('span', { text: c[1] })]); }));
    els.helpBg.appendChild(h('div', { class: 'fd-modal', role: 'dialog', 'aria-label': 'Commands' }, [
      h('h2', null, ['COMMANDS', h('button', { class: 'x', text: '×', 'aria-label': 'Close', onclick: closeModals })]),
      h('p', { class: 'lead', text: 'Type a command in the bar and press Enter. Commands are case-insensitive.' }),
      list,
      h('p', { class: 'fd-help-keys', html: '<kbd>/</kbd> focus command bar &nbsp; <kbd>Esc</kbd> close drawer / modal &nbsp; Click a vessel for details, hover for a tooltip.' })
    ]));
    els.helpBg.classList.add('open');
  }
  function field(label, name, value, opts) {
    opts = opts || {};
    var span = h('span', null, [label]);
    if (opts.link) span.appendChild(h('a', { href: opts.link, target: '_blank', rel: 'noopener', text: opts.linkText || 'get a free key' }));
    else if (opts.note) span.appendChild(h('em', { text: opts.note }));
    return h('label', { class: 'fd-field' }, [span, h('input', { type: opts.type || 'text', name: name, value: value || '', placeholder: opts.placeholder || '', autocomplete: 'off', spellcheck: 'false' })]);
  }
  function openSettings() {
    var k = loadKeys();
    var splcProxy = (FD.splc && FD.splc.getProxy && FD.splc.getProxy()) || k.splcProxy || '';
    els.settingsBg.innerHTML = '';
    var form = h('form', { class: 'fd-modal', role: 'dialog', 'aria-label': 'Settings' }, [
      h('h2', null, ['SETTINGS', h('button', { class: 'x', type: 'button', text: '×', 'aria-label': 'Close', onclick: closeModals })]),
      h('p', { class: 'lead', text: 'Keys are stored only in this browser (localStorage "fd.keys"). All are optional; without an AIS key the app runs on demo data.' }),
      field('aisstream.io API key (live AIS)', 'aisstream', k.aisstream, { link: 'https://aisstream.io/', placeholder: 'free key — live vessel positions' }),
      field('EIA API key (Brent/WTI spot)', 'eia', k.eia, { link: 'https://www.eia.gov/opendata/register.php', placeholder: 'optional' }),
      field('CARTO basemap key', 'carto', k.carto, { link: 'https://carto.com/basemaps/apikey', placeholder: 'optional — default basemap is keyless' }),
      field('SPLC proxy base URL (EDGAR)', 'splcProxy', splcProxy, { note: 'optional — seed data works without it', placeholder: 'https://your-proxy.example/sec', type: 'url' }),
      field('Finnhub key', 'finnhub', k.finnhub, { note: 'reserved — not wired yet', placeholder: 'stored only' }),
      h('label', { class: 'fd-check' }, [h('input', { type: 'checkbox', name: 'demo' }), 'Demo mode (synthetic vessels even when an AIS key is set)']),
      h('div', { class: 'fd-modal-actions' }, [
        h('button', { class: 'fd-btn-ghost', type: 'button', text: 'CANCEL', onclick: closeModals }),
        h('button', { class: 'fd-btn-primary', type: 'submit', text: 'SAVE' })
      ])
    ]);
    form.querySelector('[name="demo"]').checked = !!k.demo;
    form.addEventListener('submit', function (e) { e.preventDefault(); saveSettings(form); });
    els.settingsBg.appendChild(form);
    els.settingsBg.classList.add('open');
    setTimeout(function () { var i = form.querySelector('[name="aisstream"]'); if (i) i.focus(); }, 0);
  }
  function saveSettings(form) {
    var prev = loadKeys();
    var v = function (n) { var i = form.querySelector('[name="' + n + '"]'); return i ? i.value.trim() : ''; };
    var next = { aisstream: v('aisstream'), eia: v('eia'), carto: v('carto'), splcProxy: v('splcProxy'), finnhub: v('finnhub'), demo: form.querySelector('[name="demo"]').checked };
    saveKeys(next);
    // hand module-owned keys to their modules (markets merges into the same "fd.keys")
    if (FD.markets && FD.markets.setKeys) { try { FD.markets.setKeys({ eia: next.eia }); } catch (e) {} }
    if (FD.splc && FD.splc.setProxy && (next.splcProxy || '') !== (prev.splcProxy || '')) { try { FD.splc.setProxy(next.splcProxy); } catch (e) {} }
    if ((next.carto || '') !== (prev.carto || '')) { try { FD.map.setBasemap(next.carto ? 'carto' : 'esri', next.carto || undefined); } catch (e) {} }
    var connChanged = (next.aisstream || '') !== (prev.aisstream || '') || !!next.demo !== !!prev.demo;
    closeModals();
    if (connChanged) applyConnection();
    setHint('settings saved', 'ok');
  }

  // ---------------------------------------------------------------- keyboard
  function onKey(e) {
    var tag = (e.target && e.target.tagName || '').toLowerCase();
    var typing = tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable);
    if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); els.cmdInput.focus(); els.cmdInput.select(); return; }
    if (e.key === 'Escape') {
      if (els.settingsBg.classList.contains('open') || els.helpBg.classList.contains('open')) { closeModals(); return; }
      if (els.drawer.classList.contains('open')) { closeDrawer(); return; }
    }
  }

  // ---------------------------------------------------------------- boot
  function boot() {
    build();
    document.title = 'FlowDeck';
    var keys = loadKeys();
    // map
    try {
      FD.map.mount(els.map, {
        onSelect: function (v) { if (v) renderDrawer(v); else closeDrawer(); },
        basemap: keys.carto ? 'carto' : 'esri', cartoKey: keys.carto || undefined
      });
    } catch (e) { console.error('[FD.shell] map mount failed', e); }
    // choke pane click
    els.chokeBody.addEventListener('click', onChokeClick);
    // side panel default tab
    showTab('markets');
    // SPLC proxy from keys (mirrors to module storage)
    if (keys.splcProxy && FD.splc && FD.splc.setProxy && !FD.splc.getProxy()) { try { FD.splc.setProxy(keys.splcProxy); } catch (e) {} }
    // data
    wireData();
    renderChokeTable();
    applyConnection();
    // clock
    setInterval(function () { els.stClock.textContent = utcClock(new Date()); }, 1000);
    document.addEventListener('keydown', onKey);
    window.addEventListener('resize', function () { if (FD.map && FD.map.invalidateSize) FD.map.invalidateSize(); });
    renderStatus();
  }

  FD.shell = { run: run, openSettings: openSettings, help: openHelp, showTab: showTab, plot: plotEntities, state: state, keys: loadKeys, saveKeys: saveKeys };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
